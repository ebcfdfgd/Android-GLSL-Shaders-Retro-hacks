async function toggleFullscreen(){
 const root=document.documentElement;
 try{
  if(document.fullscreenElement||document.webkitFullscreenElement){
   if(document.exitFullscreen)await document.exitFullscreen();else if(document.webkitExitFullscreen)document.webkitExitFullscreen();
  }else if(root.requestFullscreen){await root.requestFullscreen({navigationUI:'hide'});}
  else if(root.webkitRequestFullscreen){root.webkitRequestFullscreen();}
  else{toastMsg('وضع ملء الشاشة غير مدعوم في هذا المتصفح');return false;}
  return true;
 }catch(err){toastMsg('تعذر تفعيل ملء الشاشة من WebView');return false;}
}

function updateSeparatedShootPower(p,pointerId){

 // Swipe upward on the SHOOT button to add power; swipe downward to reduce it.
 // One full button diameter changes the setting by roughly 45 percentage points.
 const range=Math.max(48,r.r*2.2);

  // Start at the previously selected power (zero until the first adjustment).
  const startPower=clamp(separatedShootPower,0,1);
  aimPower=startPower;

  separatedControlPointers.set(e.pointerId,{type:'shoot',startY:p.y,startPower,moved:false});
  return true;
 }

}

function frame(timestamp=performance.now()){

   if(appSettings.autoFastForward&&!fastForward)autoFastForwardElapsed=Math.min(2000,autoFastForwardElapsed+elapsed);
   else if(!appSettings.autoFastForward)autoFastForwardElapsed=0;
   const autoFastActive=!!(appSettings.autoFastForward&&autoFastForwardElapsed>=2000);
   const speedScale=autoFastActive?2:(fastForward?4:1);
   physicsAccumulator+=elapsed*speedScale;
   const maxTicks=speedScale===2?12:(speedScale>1?24:4);let ticks=0;
   while(physicsAccumulator>=PHYSICS_STEP_MS&&ticks<maxTicks&&shotRunning){updatePhysics();physicsAccumulator-=PHYSICS_STEP_MS;ticks++;}
   // Drop excess debt rather than running a large catch-up burst that looks like teleporting.
   if(physicsAccumulator>PHYSICS_STEP_MS*maxTicks)physicsAccumulator=PHYSICS_STEP_MS*maxTicks;
  }else physicsAccumulator=0;
 }else physicsAccumulator=0;

 if(now-lastRenderTime>=RENDER_INTERVAL_MS-1){render();lastRenderTime=now;}

}
