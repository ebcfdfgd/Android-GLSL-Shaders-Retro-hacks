<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>تجربة</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#000;--fg:#8fb8e8;--ln:#1d3a66}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000}}
:root[data-theme="dark"]{--bg:#000}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,"Segoe UI",Tahoma,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;background:#000}
.sc{position:fixed;inset:0;background:#000;display:none;flex-direction:column;align-items:center;justify-content:center;gap:22px;text-align:center;padding:12px;overflow:auto}
h1{font-weight:300;font-size:clamp(26px,6vw,46px);margin:0;letter-spacing:2px}
#home #ht{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;line-height:1.5}
#menu #mt{font-size:clamp(22px,5.5vw,42px);line-height:1.5}
.brand-credit{display:inline-flex;align-items:center;direction:ltr;font-family:system-ui,"Segoe UI",sans-serif;font-size:clamp(10px,1.8vw,13px);font-weight:700;letter-spacing:1px;color:#b8afff;background:linear-gradient(135deg,#07101d,#11102b);border:1px solid #6557a8;border-radius:999px;padding:7px 12px;white-space:nowrap;box-shadow:0 0 16px #765fff30;text-shadow:0 0 8px #8a7dff55}
#backHome{min-width:min(260px,80vw);margin-top:2px;border-color:#6557a8;color:#c5bdff}
#intro h1{opacity:0;animation:f 3.6s ease-in-out forwards}
@keyframes f{0%{opacity:0}30%,70%{opacity:1}100%{opacity:0}}
#gr{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;width:min(640px,94vw)}
@media(max-width:520px){#gr{grid-template-columns:repeat(2,1fr)}}
button{font:inherit;color:#7fb6ff;background:#03070d;border:1px solid var(--ln);border-radius:10px;padding:14px 8px;cursor:pointer}
button small{display:block;opacity:.6;font-size:12px;margin-top:4px}
button:disabled{opacity:.3;cursor:default}
.big{font-size:22px;padding:14px 40px}
.sc p{max-width:520px;margin:0;line-height:1.8;opacity:.8}.sc p#hd{color:#9b8cff;font-size:20px;font-weight:600;opacity:1}#ey{letter-spacing:3px;font-size:13px;opacity:.6!important}
#rb{display:none;position:fixed;right:max(18px,env(safe-area-inset-right,0px));bottom:max(18px,env(safe-area-inset-bottom,0px));width:96px;height:96px;border-radius:50%;font-size:40px;padding:0;touch-action:none;z-index:5;background:#050d1c;box-shadow:0 0 18px #1d3a66;-webkit-touch-callout:none}
#rr{border:1px solid var(--ln);border-radius:10px;padding:14px 22px;min-width:min(420px,88vw);text-align:start;line-height:2}#ry{letter-spacing:2px;opacity:.7!important}#rq{color:#9b8cff;font-style:italic;opacity:1!important}#ex{transition:opacity .7s;font-size:18px;color:#9b8cff;min-height:2em;opacity:1!important}
#fsb{position:fixed;top:max(8px,env(safe-area-inset-top,0px));left:8px;z-index:9;padding:8px 12px;font-size:18px}
button:not(:disabled):active{background:#0a1a30}
</style></head><body>
<canvas id="cv"></canvas>
<div class="sc" id="intro"><h1 id="it"></h1></div>
<div class="sc" id="home"><p id="ey"></p><h1 id="ht"></h1><button class="big" id="st" onclick="menu()"></button><p id="hd"></p><p id="hs"></p><button id="lg2" onclick="setLang()"></button></div>
<div class="sc" id="rep"><p id="ry"></p><div id="rr"></div><p id="rq"></p><button id="rc" onclick="after()"></button></div>
<div class="sc" id="end"><h1 id="et"></h1><p id="ex"></p><button id="eb" onclick="menu()"></button></div>
<button id="fsb" onclick="fs()">⛶</button><button id="rb">▶</button>
<div class="sc" id="menu"><h1 id="mt"></h1><div id="gr"></div><button id="backHome" type="button" onclick="scr('home')">↩ العودة إلى الشاشة الرئيسية</button><button id="lg" onclick="setLang()"></button></div>
<script>
const $=i=>document.getElementById(i);
let S={lang:'ar',un:1};
try{Object.assign(S,JSON.parse(localStorage.getItem('boreChallenge')||'{}'))}catch(e){}
const sv=()=>{try{localStorage.setItem('boreChallenge',JSON.stringify(S))}catch(e){}};
const T={ar:{nw:'تجربة جديدة',t:'تجربة',lvl:'المستوى',lg:'English',done:'أنجزت المستوى',nm:['الممر الأول: البداية','الممر الثاني: ما بعد البداية','الممر الثالث: ما قبل الصمت','الممر الرابع: إعادة','الممر الخامس: نفس الممر','الممر السادس: ربما','الممر السابع: لا شيء','الممر الثامن: الصدى','الممر التاسع: قبل الأخير','الممر العاشر: الفراغ'],qt:['«الطريق لا يُقطع.. الطريق يُحتمل.»','«من يبحث عن المعنى في الفراغ يجد صداه.»','«كل خطوة تثبت أن التي قبلها لم تكن كافية.»','«الصبر ليس انتظارًا، إنه مشي بلا وجهة.»','«لو كان للمسافة معنى لما تشابهت.»','«الصمت لا يُسمع إلا بعد أن تكفّ عن الاستماع.»','«لا شيء حدث، وهذا بالضبط ما تم قياسه.»','«الملل باب، والباب مفتوح على جدار.»','«كلما اقتربت من النهاية نسيت سبب البداية.»','«أنت لم تصل.. أنت فقط توقفت عن الابتعاد.»'],pv:['مقبول','جيد','مرتفع','مرتفع جدًا','استثنائي','غير مفهوم','لا يمكن قياسه','تجاوز حدود الجهاز','—','غير موجود'],cv:['غير حاسم','يحتاج مزيدًا من المشي','لا استنتاج','نتائج متضاربة'],rt:'تقرير المختبر',sy:'رموز مرصودة',xp:'المتوقع',pid:'رقم المشارك',pi:'مؤشر الصبر',cl:'الاستنتاج',go:'متابعة',ix:['كانت رحلة داخلية.','كان اختبارًا لصبرك.','لم يكن هناك معنى أصلًا.'],ms:['لا شيء يحدث.','ما زلت تمشي.','هذا هو منتصف الطريق. لا شيء فيه.','الصمت أيضًا جزء من التجربة.','لا أحد يراقبك. ربما.','تنفّس.','الوقت لا يمر أسرع إن نظرت إليه.','أمامك نفس المسافة تقريبًا.','لا تحتاج إلى سبب لتكمل.','نصف الطريق. نصف الصبر. نصف الهدوء.'],ey:'🔬 بروتوكول اختبار الصبر',st:'بدء التجربة التجريدية',hd:'هل أنت من القلائل القادرين على إنهائها؟',story:'عشرة ممرات، وعشرة حضور مختلفين. في البداية سيبدون كأنهم يتحدثون من بعيد؛ ثم سيعرف كل واحد منهم ما تخفيه وحدتك، وسيضيق الفراغ كلما تقدمت. لا توجد معركة تنقذك، ولا باب مضمون للعودة… فقط خطواتك، وأصوات الحكاية التي لا تريد أن تنتهي.',end:'تهانينا! لقد أنجزت اللاشيء حرفيًا.',back:'العودة للمراحل'},
en:{nw:'A New Experience',t:'Experiment',lvl:'Level',lg:'العربية',done:'Level complete',nm:['Corridor One: The Beginning','Corridor Two: After the Beginning','Corridor Three: Before the Silence','Corridor Four: Repeat','Corridor Five: The Same Corridor','Corridor Six: Perhaps','Corridor Seven: Nothing','Corridor Eight: The Echo','Corridor Nine: Before the Last','Corridor Ten: The Void'],qt:['\u201cThe road is not crossed.. it is endured.\u201d ','\u201cWho seeks meaning in the void finds only its echo.\u201d ','\u201cEvery step proves the previous one was not enough.\u201d ','\u201cPatience is not waiting, it is walking without a destination.\u201d ','\u201cIf distance had meaning, it would not look the same.\u201d ','\u201cSilence is heard only after you stop listening.\u201d ','\u201cNothing happened, and that is exactly what was measured.\u201d ','\u201cBoredom is a door, and the door opens onto a wall.\u201d ','\u201cThe closer you get to the end, the less you remember the beginning.\u201d ','\u201cYou did not arrive.. you just stopped moving away.\u201d '],pv:['Acceptable','Good','High','Very high','Exceptional','Unintelligible','Unmeasurable','Exceeded device limits','\u2014','Nonexistent'],cv:['Inconclusive','Needs more walking','No conclusion','Conflicting results'],rt:'Lab Report',sy:'Symbols observed',xp:'expected',pid:'Participant ID',pi:'Patience index',cl:'Conclusion',go:'Continue',ix:['It was an inner journey.','It was a test of your patience.','There was never any meaning.'],ms:['Nothing is happening.','Still walking.','This is the middle. There is nothing here.','Silence is part of the experiment too.','Nobody is watching. Probably.','Breathe.','Time does not pass faster if you stare at it.','You still have about the same distance to go.','You do not need a reason to keep going.','Half the road. Half the patience. Half the calm.'],ey:'🔬 Patience Test Protocol',st:'Start the Abstract Experience',hd:'Are you one of the few who can finish it?',story:'Ten corridors. Ten different presences. At first, they will speak from far away; then each will learn the shape of your loneliness, and the void will tighten as you go deeper. There is no battle to save you and no guaranteed door back… only your footsteps, and the story that refuses to end.',end:'Congratulations! You have literally accomplished nothing.',back:'Back to levels'}};
const tx=k=>T[S.lang][k];
const mt=n=>S.lang=='ar'?(n==1?'دقيقة':n==2?'دقيقتان':n+' دقائق'):n+' min';
// Dialogue-driven abstract psychological horror: each level has its own character and a non-repeating dialogue pool.
const HORROR={
ar:{
 names:['الحارس عند الباب','الرفيق المتأخر','الذاكرة المكسورة','العدّاد','النسخة الأخرى','الطفل خلف الجدار','المقيم في الصمت','قاع البئر','الوجه الأخير','الفراغ نفسه'],
 banks:[
 {first:['كنت أظن أن أحدًا سيأتي قبلك.','لا بأس… لن أسألك لماذا جئت.','الممر أهدأ عندما لا تحاول فهمه.','كل ما أريده أن تكمل المشي؛ لا تتركني هنا مرة أخرى.','أسمع خطواتك، وهذا أفضل من الصمت بقليل.','هل شعرت يومًا أنك وصلت إلى مكان لا ينتظرك فيه أحد؟','لا تسرع. الباب لا يهرب… لكنه قد ينساك.','عندما تنتهي من المشي، من سيبقى هنا معي؟'],a:['الممر يتنفس ببطء.','الضوء لا يصل إلى آخر الطريق.','خطواتك تبدو بعيدة حتى وأنت قريب.','هناك كرسي فارغ في نهاية العتمة.','الظلال لا تغادر هذا المكان.','الباب يفتح للداخل فقط.','الصمت هنا أقدم منك.'],b:['الوحدة لا تحتاج إلى ظلام كي تبدأ.','أنا أحاول تذكّر صوت شخص آخر.','لا أريد أن أكون آخر من ينتظر.','لا شيء سيجيبك إن ناديت.','ربما كان المكان فارغًا قبل وصولنا.','لا تجعلني أعتاد غيابك.','لم أعد أعرف كيف يبدو الرجوع.']},
 {first:['تأخرتَ… لكنني كنت أعرف أنك ستأتي.','أنا أمشي خلفك بمسافة لا تستطيع قياسها.','حين تلتفت، أكون قد وصلت إلى المكان الذي تركته.','أحيانًا أظن أننا كنا صديقين قبل أن يبدأ هذا الطريق.','لا تتوقف الآن؛ لا أعرف كيف أكون وحدي.','كنت أجهّز لك كلامًا كثيرًا، ثم نسيت لماذا جئت.','هل لاحظت أنني لا أسبقك ولا أبتعد؟','لو وصلت قبلك، لا أظن أنني سأعرفك.'],a:['المسافة بيننا تتقلص ثم تعود.','الصوت الذي يشبه صوتك يأتي متأخرًا.','كل منعطف يعيدني إلى آخر كلمة قلتها.','الطريق يحتفظ بمكان لشخصين.','هناك ظل ثانٍ لا يطابق خطوتك.','الهواء يترك فراغًا بجانبك.','الذكرى التي تجمعنا بلا وجه.'],b:['لم أجد أحدًا ينتظرني في الخارج.','أخشى أن تكون أنت آخر شخص أتذكره.','لم أعد أميّز بين انتظارك وغيابك.','أريد أن أقول شيئًا، لكن الجملة تضيع.','لا تتركني أصل وحدي إلى النهاية.','أحيانًا يبدو قربك أبعد من كل شيء.','أعرف أنك لم ترني، ومع ذلك جئت.']},
 {first:['هل هذه الذكرى لك أم أنني زرعتها في الطريق؟','كنت أعرف اسمك منذ لحظة… ثم اختفى.','كلما حاولت تذكّر البيت، أجد هذا الممر مكانه.','في رأسي غرفة مضاءة، لكنني لا أذكر من كان فيها.','أشعر أنني نسيت شيئًا لا يمكن تعويضه.','لا تحاول تذكّر البداية؛ هي تتغيّر كل مرة.','أنت لا تفقد الطريق. أنت تفقد سبب العودة.','أسمع ضحكة قديمة، ثم أتذكر أنها لم تكن هنا أبدًا.'],a:['الصور على الجدار بلا وجوه.','الذاكرة تترك بقعًا باردة في الممر.','الأبواب تفتح على لحظات ناقصة.','اسمك مكتوب ثم ممسوح.','الرائحة القديمة تختفي قبل أن تعرفها.','كل شيء مألوف بطريقة مؤلمة.','الماضي يتحرك خلف الزجاج المعتم.'],b:['ما نسيته قد يكون آخر ما كان يربطك بالعالم.','الحنين غرفة لا يُسمح لك بالخروج منها.','لا أستطيع أن أثبت أن شيئًا جميلًا حدث.','حتى الحزن بدأ ينسى سببه.','ما زلت تبحث عن مكان لم يعد موجودًا.','أنا أتذكّر الوجع أكثر من صاحبه.','ربما لا توجد نسخة كاملة منك لتعود إليها.']},
 {first:['أنا أعدّ خطواتك كي لا يختفي كل شيء.','واحدة… اثنتان… لا، لقد نسيت الرقم.','كلما توقفت، يعود العدّ إلى البداية.','أنت تمشي، لكنني لا أرى أي فرق في المسافة.','لا تسألني عن النهاية. الأرقام لا تعرفها.','كنت أظن أن العدّ يمنح الأشياء معنى. كنت مخطئًا.','خطوتك التالية لن تصلح ما سبقها.','أستطيع عدّ خطواتك، ولا أستطيع فعل أي شيء من أجلك.'],a:['الأرض تحفظ أثرًا لا يراه أحد.','الأرقام تتساقط من الجدران.','المسافة تكبر رغم ثبات العلامات.','الساعة بلا عقارب.','النهاية تتحرك كلما اقتربت منها.','كل خطوة تشبه التي قبلها.','الصوت بين خطوتين أطول من الطريق.'],b:['العجز أن تعرف ما يحدث ولا تقدر على تغييره.','لا توجد نتيجة تنتظر من يصل أولًا.','العدّ لا يعيد ما فقدناه.','أنت تتحرك، لكن شيئًا في داخلك لا يغادر مكانه.','لا أحد سيمنحك نقطة مقابل هذا الاحتمال.','حتى الأرقام تعبت من تكرار نفسها.','لن يصبح الفراغ أقل اتساعًا إذا قسته.']},
 {first:['أنا أتحرك عندما تتحرك، لكنني لست ظلك.','جرّب أن تبطئ… أريد أن أرى هل ستفعل مثلي.','وجهك مألوف لي، مع أنني لم أره من قبل.','أنت تنظر إلى الأمام وأنا أتعلم كيف أبدو مثلك.','إذا كنت النسخة الأصلية، فلماذا أشعر أنني أتذكرك أكثر؟','لا تخف من انعكاسك. خف من اللحظة التي يتوقف فيها عن تقليدك.','لقد رفعت يدك في رأسي قبل أن ترفعها أنت.','من منا يريد حقًا أن يخرج من هنا؟'],a:['الظل يتأخر نصف نبضة.','السطح الأسود يعكس مكانًا آخر.','هناك هيئة تسير بمحاذاتك.','الخطوات تتطابق ثم تنفصل.','وجه بلا ملامح يتعلم ابتسامتك.','الانعكاس ينظر إلى جهة مختلفة.','الممر ينسخ كل شيء إلا مخرجًا.'],b:['قد تكون أنت الذكرى التي أحتفظ بها عن نفسي.','لا أعرف أيّنا بدأ هذه الرحلة.','ربما لا توجد نسخة تستطيع إنقاذ الأخرى.','أشعر أن أحدنا سيُمحى في النهاية.','لا تثق في شيء يشبهك تمامًا.','ما فقدته في داخلك وجد طريقه إلى الخارج.','إذا توقفتُ أنا، هل ستتوقف أنت؟']},
 {first:['أنا هنا خلف الجدار منذ وقت طويل جدًا.','هل يمكنك أن تبقى قليلًا؟ لا أحد يرد على كلامي.','كنت أسمع العالم من هنا، ثم صار بعيدًا.','لا أعرف لماذا يخاف الكبار من الأماكن التي لا يتكلم فيها أحد.','طرقتُ الجدار ألف مرة. في المرة الأخيرة، طرق أحدهم من الجهة الأخرى.','هل جئت لتأخذني معك أم لتتأكد أنني ما زلت هنا؟','لا تقل إنك ستعود إن لم تكن تعرف الطريق.','أخبئ صوتي كي لا يضيع، لكن لا أحد يسمعه.'],a:['الجدار يحتفظ بحرارة يد صغيرة.','هناك لعبة قديمة في زاوية لا تظهر.','الطرقات تردّ بعد تأخير طويل.','الممر بحجم غرفة نسيت نافذتها.','ضوء ضعيف يختبئ تحت الباب.','الخطوط على الحائط أطول من قامتي.','الأرض تتذكر ركضًا لم يعد يحدث.'],b:['الوحدة تبدو أكبر عندما لا تعرف اسمها.','كل ما أردته شخصًا يسمعني حتى النهاية.','أخشى أن أخرج فلا أجد أحدًا هناك أيضًا.','الصمت جعل صوتي يبدو كأنه لشخص آخر.','لا تتركني مع السؤال نفسه مرة أخرى.','حتى الخيال تعب من مواساتي.','أريد أن أصدق أن أحدًا فتح الباب يومًا.']},
 {first:['لا أطلب منك أن تكون سعيدًا. أطلب فقط أن تواصل الحركة.','هناك أيام لا يحدث فيها شيء، ومع ذلك تشعر أنك خسرت كل شيء.','أنا لا أبكي؛ لم يعد لديّ ما يكفي من القوة لذلك.','كل باب هنا يشبه وعدًا لم يستطع أحد الوفاء به.','هل تعرف التعب الذي لا يزول بالنوم؟ إنه يسكن هذا المكان.','لا أريد أن أختفي. أريد فقط أن يتوقف كل شيء عن مطالبتي بالمحاولة.','أحيانًا تكون الخطوة أصعب من المسافة كلها.','أنا لا أكره النور… فقط لم أعد أتوقعه.'],a:['الهواء ثقيل كأنه يوم لم ينتهِ.','الألوان تنسحب من الجدران ببطء.','المقعد الفارغ ينتظر شخصًا لا يأتي.','الممر لا يهددك؛ إنه فقط لا يهتم بك.','كل شيء هنا يبدو متعبًا حتى الظلال.','الضوء يضيء المكان ولا يدفئه.','الطريق يواصل نفسه بلا سبب.'],b:['العجز ليس أنك لا تعرف الطريق، بل أنك لا تجد قوة لتجربه.','لا تجعل صمتك دليلًا على أنك لا تستحق أن تُسمع.','حتى الحزن صار روتينًا لا يحتاج إلى تفسير.','كل شيء يطلب منك النهوض، ولا شيء يساعدك.','أريد أن أصدق أن هذه الحالة ليست كل حياتك.','الفراغ لا يلومك؛ وهذا ما يجعله مخيفًا.','ربما يكفي الآن أن تأخذ خطوة واحدة.']},
 {first:['أصواتك لا تصل إلى السطح. أنا أحتفظ بها في الأسفل.','كلما صرخت، اتسع المكان بدل أن يجيبك.','أنا قاع لا تستطيع رؤيته؛ لا تخلط بيني وبين النهاية.','الفراغ هنا ليس خاليًا… إنه ممتلئ بما لم تقله.','أسقطتَ كلمة، وما زالت تهوي.','لا أحتاج إلى مطاردتك. كل الطرق تنحدر نحوي.','هل تشعر أن الأرض صارت بعيدة عن قدميك؟','كنت أظن أن الصدى يعيد الأصوات. هذا المكان يعيد الوحدة فقط.'],a:['الجدران تبتعد كلما حاولت لمسها.','الصدى يعود بصوت أضعف من صوتك.','الضوء فوقك يتحول إلى نقطة باردة.','الهواء ينزل بدل أن يرتفع.','العمق بلا قاع وبلا حركة.','الحروف تسقط من أفكارك.','الطريق يفتح مساحة أخرى تحته.'],b:['كلما طلبت جوابًا، صار السؤال أعمق.','لا تستطيع حمل كل هذا الفراغ وحدك.','لا شيء يمسك بك، حتى ظلك.','أنت لا تسقط بسرعة؛ أنت تتعلم معنى السقوط البطيء.','حتى الصدى يحتاج إلى مكان يعود إليه.','هناك فرق بين أن تكون وحدك وأن لا تجد طريقًا إلى أحد.','سأحتفظ بآخر كلمة تقولها، مهما كانت صغيرة.']},
 {first:['تسعة ممرات جعلتك تعتقد أنك تعرف شكل الخوف. لم تعرفه بعد.','أنا أراك داخل الحكاية، لا من خارجها.','كل ما تركته وراءك صار واقفًا عند أول الطريق.','لو عدت الآن، لن تجد الشخص الذي بدأ.','أنا لا أريد منعك من الوصول. أريدك أن تعرف ما الذي سيصل.','هل ما زلت تمشي لأنك تريد النهاية أم لأنك نسيت كيف تتوقف؟','أنت تستحق الراحة، لكن هذا الممر لا يعرف معنى الرحمة.','لا تصدق الهدوء القادم. لقد تعلمتُ كيف أقلده.'],a:['الأبواب خلفك اختفت من المشهد.','العلامات تنظر في الاتجاه المعاكس.','الظل يتقدمك بخطوة واحدة.','الممر يضيق حول أفكارك.','كل ذكرى تقف كأنها شاهد.','الضوء يرمش كأنه يحاول تذكّر وجهك.','المسافة تلتف لتعود من الداخل.'],b:['لا توجد طريقة لتغيير ما حدث، لكن الطريق لم ينتهِ بعد.','الخوف يهمس حين تتعب من مقاومته.','أعرف أنك تريد أن تنتهي هذه الوحدة، لا أن تنتصر عليها.','لا تمنحني اسمك الأخير. احتفظ بشيء لنفسك.','الشيء الذي تخشاه ربما هو أن لا يحدث أي شيء.','بعض الأبواب لا تُفتح؛ لكنها ليست كل العالم.','كل ما بقي منك ليس ملكًا لهذا المكان.']},
 {first:['لم أعد أحتاج إلى وجه. أنت تملأ الفراغ بما يكفي.','هنا لا يوجد خلفك أو أمامك؛ هناك فقط ما تبقّى منك.','هذه آخر شخصية ستقابلك، لأنني سأكون آخر شيء تتخيله.','لا تبحث عن باب. ابحث عن الجزء الذي ما زال يريد الخروج.','أستطيع جعل كل شيء يصمت… لكنني لا أستطيع اختيار ما ستتذكره.','الممر لا ينتهي عند خط النهاية؛ إنه ينتهي عندما لا يعود لديك ما تقوله.','أنت وصلت أبعد مما توقعت. لا تجعل هذا المكان يقنعك أنك لم تفعل.','أنا الفراغ نفسه. ومع ذلك، كنت أنت من يملأني بالخوف.'],a:['المسافة انطفأت ولم يبقَ إلا وقع الخطوات.','العلامات ذابت في سواد لا يتحرك.','كل الأبواب صارت فتحة واحدة بلا إطار.','الضوء الأخير لا يعرف إلى أين يذهب.','حتى الصدى توقف عن انتظار صاحبه.','الظل لم يعد منفصلًا عن قدميك.','الطريق يطوي نفسه داخل نقطة بعيدة.'],b:['لا شيء هنا يستطيع أن يقرر قيمتك بدلًا منك.','الوحدة تقول إنك منسيّ، لكنها ليست دليلًا على ذلك.','العجز شعور ثقيل، وليس حكمًا نهائيًا عليك.','لا تمنح الفراغ حق كتابة خاتمتك.','ربما لا توجد إجابة، لكن هذا لا يجعل السؤال بلا قيمة.','حتى في أكثر الأماكن خلوًا، تظل الخطوة اختيارًا.','عندما تصمت الحكاية، لا يعني ذلك أن حكايتك انتهت.']}
]},
en:{
 names:['The Keeper at the Door','The Late Companion','The Broken Memory','The Counter','The Other Copy','The Child Behind the Wall','The One Who Stays Silent','The Bottom of the Well','The Last Face','The Void Itself'],
 banks:[
 {first:['I thought someone else would arrive before you.','It is all right… I will not ask why you came.','The corridor is quieter when you stop trying to understand it.','All I ask is that you keep walking; do not leave me here again.','I can hear your steps. It is slightly better than silence.','Have you ever reached a place where nobody was waiting for you?','Do not hurry. The door cannot run… but it may forget you.','When you finish walking, who will stay here with me?'],a:['The corridor breathes slowly.','The light never reaches the end.','Your footsteps sound distant even when you are near.','There is an empty chair at the edge of the dark.','The shadows never leave this place.','The door opens only inward.','The silence here is older than you.'],b:['Loneliness does not need darkness to begin.','I am trying to remember another person’s voice.','I do not want to be the last one waiting.','Nothing will answer if you call out.','Perhaps this place was empty before we arrived.','Do not let me get used to your absence.','I no longer remember what returning feels like.']},
 {first:['You are late… but I knew you would come.','I walk behind you at a distance you cannot measure.','When you turn around, I have reached the place you left.','Sometimes I think we were friends before this road began.','Do not stop now; I do not know how to be alone.','I prepared so much to say, then forgot why I came.','Have you noticed I never pass you and never fall away?','If I reach the end before you, I may not recognize you.'],a:['The distance between us shrinks, then returns.','A voice that sounds like yours arrives late.','Every turn brings back your last word.','The road has room for two people.','A second shadow does not match your step.','The air leaves an empty space beside you.','There is a memory of us without a face.'],b:['I found nobody waiting for me outside.','I fear you are the last person I can remember.','I can no longer tell waiting for you from missing you.','I want to say something, but the sentence disappears.','Do not make me reach the end alone.','Sometimes your closeness feels farther away than anything.','I know you have not seen me, and still you came.']},
 {first:['Is this memory yours, or did I plant it in the road?','I knew your name a moment ago… then it vanished.','Whenever I try to remember home, this corridor takes its place.','There is a lit room in my mind, but I cannot remember who was in it.','I feel I have forgotten something that cannot be replaced.','Do not try to remember the beginning; it changes every time.','You are not losing the way. You are losing the reason to return.','I hear an old laugh, then remember it was never here.'],a:['The pictures on the wall have no faces.','Memory leaves cold patches in the corridor.','The doors open onto incomplete moments.','Your name is written, then erased.','The old scent disappears before you recognize it.','Everything feels familiar in a painful way.','The past moves behind dark glass.'],b:['What you forgot may be the last thing tying you to the world.','Nostalgia is a room you are not allowed to leave.','I cannot prove that anything beautiful ever happened.','Even sadness is beginning to forget its reason.','You are looking for a place that no longer exists.','I remember the ache more clearly than its owner.','Perhaps there is no complete version of you to return to.']},
 {first:['I count your steps so everything will not disappear.','One… two… no, I have forgotten the number.','Whenever you stop, the count begins again.','You keep walking, but I see no difference in the distance.','Do not ask me about the end. Numbers do not know it.','I thought counting gave things meaning. I was wrong.','Your next step cannot repair the one before it.','I can count your steps, but I cannot do anything for you.'],a:['The ground keeps a trace nobody can see.','Numbers fall from the walls.','The distance grows while the markers stay still.','The clock has no hands.','The ending moves whenever you approach it.','Every step resembles the previous one.','The sound between two steps is longer than the road.'],b:['Helplessness is knowing what is happening and being unable to change it.','There is no reward for reaching this place first.','Counting cannot bring back what we lost.','You move, but something inside you never leaves its place.','Nobody will give you a point for enduring this.','Even numbers are tired of repeating themselves.','The void will not shrink because you measured it.']},
 {first:['I move when you move, but I am not your shadow.','Try slowing down… I want to see if you will copy me.','Your face is familiar, though I have never seen it before.','You look ahead while I learn how to look like you.','If you are the original, why do I remember you better?','Do not fear your reflection. Fear when it stops copying you.','I raised your hand in my mind before you did.','Which one of us truly wants to leave?'],a:['The shadow lags by half a heartbeat.','The black surface reflects somewhere else.','A figure walks beside you.','The footsteps match, then separate.','A faceless face is learning your smile.','The reflection looks in another direction.','The corridor copies everything except an exit.'],b:['You may be the memory I keep of myself.','I do not know which of us began this journey.','Perhaps no copy can save the other.','I feel one of us will be erased at the end.','Trust nothing that looks exactly like you.','What you lost inside found its way outside.','If I stop, will you stop too?']},
 {first:['I have been behind this wall for a very long time.','Could you stay a little? Nobody answers me.','I used to hear the world from here, then it grew distant.','I do not know why grown-ups fear places where nobody speaks.','I knocked a thousand times. The last time, someone knocked back.','Did you come to take me with you, or to check that I am still here?','Do not promise to return if you do not know the way.','I hide my voice so it will not get lost, but nobody hears it.'],a:['The wall keeps the warmth of a small hand.','An old toy waits in a corner that never appears.','The knocks answer after a long delay.','The corridor is the size of a room that forgot its window.','A weak light hides beneath the door.','The lines on the wall are taller than I am.','The floor remembers running that no longer happens.'],b:['Loneliness grows when you do not know its name.','All I wanted was someone to hear me to the end.','I am afraid I will leave and find nobody there either.','Silence made my voice sound like someone else’s.','Do not leave me with the same question again.','Even imagination is tired of comforting me.','I want to believe someone opened this door once.']},
 {first:['I am not asking you to be happy. I am asking you to keep moving.','Some days nothing happens, yet it feels as if you lost everything.','I am not crying; I no longer have the strength for it.','Every door here looks like a promise nobody could keep.','Do you know the exhaustion that sleep cannot remove? It lives here.','I do not want to disappear. I just want everything to stop demanding another try.','Sometimes a single step is harder than the whole distance.','I do not hate the light… I just no longer expect it.'],a:['The air is heavy, like a day that never ended.','Colors slowly withdraw from the walls.','An empty seat waits for someone who never comes.','The corridor does not threaten you; it simply does not care.','Everything here seems tired, even the shadows.','The light brightens the room but does not warm it.','The road continues without a reason.'],b:['Helplessness is knowing the way but having no strength to try it.','Do not let your silence become proof that you do not deserve to be heard.','Even sadness has become a routine needing no explanation.','Everything asks you to rise, and nothing helps.','I want to believe this state is not your whole life.','The void never blames you, and that is what makes it frightening.','Perhaps one step is enough for now.']},
 {first:['Your words never reach the surface. I keep them down here.','The more you shout, the wider this place grows instead of answering.','I am a bottom you cannot see; do not mistake me for the end.','The void here is not empty… it is full of everything you never said.','You dropped a word, and it is still falling.','I do not need to chase you. Every road slopes toward me.','Can you feel the ground growing distant from your feet?','I thought an echo returned voices. This place returns only loneliness.'],a:['The walls move away whenever you try to touch them.','The echo returns weaker than your voice.','The light above becomes a cold point.','The air falls instead of rising.','The depth has no bottom and no movement.','Letters are falling out of your thoughts.','The road opens another space beneath itself.'],b:['Each time you ask for an answer, the question grows deeper.','You cannot carry all this emptiness alone.','Nothing holds you, not even your shadow.','You are not falling quickly; you are learning the meaning of a slow fall.','Even an echo needs somewhere to return.','There is a difference between being alone and having no way to reach anyone.','I will keep your last word, however small it is.']},
 {first:['Nine corridors made you think you knew what fear looked like. You did not.','I see you inside the story, not from outside it.','Everything you left behind is standing at the start.','If you returned now, you would not find the person who began.','I do not want to stop you reaching the end. I want you to know what will arrive.','Are you still walking because you want an ending, or because you forgot how to stop?','You deserve rest, but this corridor does not know mercy.','Do not trust the coming quiet. I learned to imitate it.'],a:['The doors behind you have vanished from the scene.','The markers face the wrong direction.','The shadow moves one step ahead.','The corridor narrows around your thoughts.','Every memory stands like a witness.','The light flickers as if trying to remember your face.','The distance loops back from the inside.'],b:['You cannot change what happened, but the road is not over yet.','Fear whispers when you tire of resisting it.','I know you want the loneliness to end, not to defeat it.','Do not give me your final name. Keep something for yourself.','Perhaps the thing you fear is that nothing will happen.','Some doors do not open, but they are not the whole world.','Not everything left of you belongs to this place.']},
 {first:['I no longer need a face. You fill the void well enough.','Here there is no behind or ahead; only what remains of you.','I am the last character you will meet, because I am the last thing you can imagine.','Do not look for a door. Look for the part of you that still wants to leave.','I can make everything silent… but I cannot choose what you remember.','The corridor does not end at the finish line; it ends when you have nothing left to say.','You came farther than I expected. Do not let this place convince you that you did nothing.','I am the void itself. And still, you were the one who filled me with fear.'],a:['The distance went dark, leaving only the sound of footsteps.','The markers melted into a motionless black.','Every door became one opening without a frame.','The final light no longer knows where to go.','Even the echo stopped waiting for its owner.','The shadow is no longer separate from your feet.','The road folds itself into a distant point.'],b:['Nothing here can decide your worth for you.','Loneliness says you are forgotten, but it is not proof.','Helplessness is a heavy feeling, not a final verdict on you.','Do not give the void the right to write your ending.','There may be no answer, but that does not make the question worthless.','Even in the emptiest place, the next step remains a choice.','When the story falls silent, it does not mean your story is over.']}
]}}
const EXTRA_DIALOGUE={"ar":[["استنى... أنت سمعت الخبطة دي، صح؟","أنا شايفك حتى لما تبص بعيد.","ما تبصش وراك بسرعة؛ خليك طبيعي.","الباب ده كان مقفول قبل ما تدخل، فاكر؟","مش لازم تصدقني، بس حد عدّى من هنا قبلك بثواني.","خطواتك ليها صدى... وفي خطوة تانية مش بتاعتك.","كل مرة ترفع عينك، بحس إنك بتدور عليّ.","أنا مش جوه الباب ولا برّه؛ أنا في اللحظة اللي بتتردد فيها.","حسّيت إن حد نده اسمك؟ أنا ما قلتوش.","لو سمعت نفس طويل، ما تدورش على صاحبه.","إنت ماشي كأنك عارف الطريق، بس عينيك بتقول غير كده.","أنا عدّيت كل اللي دخلوا. محدش سأل مين واقف هنا.","فيه مكان وراك فاضي... بس مش بيفضل فاضي.","إنت فاكر إنك اخترت تدخل؟ جرّب تفتكر أول خطوة.","ما تقلقش من الضلمة؛ قلّق من الجزء اللي شايفك فيها.","لو اختفى الباب، ما تقولش إني ما حذرتكش.","أنا بسمعك تفكر قبل ما تتكلم.","متستعجلش؛ اللي مستنيك مش هيمشي.","جرّبت تقف؟ يمكن الممر هو اللي يكمل لوحده.","كل ده عادي... لحد ما تلاحظ إن مفيش حد تاني بيتحرك.","إنت مش أول واحد يسألني أنا مين.","بص قدامك، أحسن ما تلاحظ إن ظلك باصص لك.","فيه نور تحت الباب، مع إن مفيش أوضة وراه.","أنا عارف إنك عايز تطلع؛ السؤال مين قالك إنك دخلت؟","نفسك عالي شوية. خايف، ولا بتحاول تثبت إنك موجود؟","لو حسيت إن المكان ضاق، ما تلومش الحيطان."],["أنا لسه وراك، ماشي؟ ما تلفش، هتضيعني تاني.","كنت فاكر إن وجود حد معاك هيهوّنها، بس إحنا الاتنين تايهين.","كل ما تقرّب مني، المسافة بتزيد. شايف المهزلة؟","أنا بكلمك من مكان المفروض إنك عديت منه.","لو سمعت ضحكة وراك، ما تفترضش إنها ضحكتي.","أنا فاكر إننا اتقابلنا قبل كده، بس كل ذكرى ليك وشّ مختلف.","ما تسيبنيش أتكلم لوحدي... الصمت هنا بيرد.","إنت بتحس بوجودي، صح؟ حتى لو مش شايفني.","أنا بتأخر عنك بخطوة، أو يمكن إنت اللي سابقني.","لو وصلت للنهاية قبلي، استناني... لا، بلاش تستنى.","كل مرة تنادي، صوتك بيرجع من حتة أبعد.","أنا مش عايز أكون آخر واحد فاكر إن فيه حد تاني.","فيه كرسيين في الصورة، ليه كل مرة بتشوف واحد بس؟","الطريق مش بيبعدني عنك؛ هو بيبعدك عن فكرة إنك مش لوحدك.","أنا حاولت أجري ناحيتك، بس رجليّ ما اتحركوش.","ممكن تبص جنبي بدل ما تبص ورايا؟ فيه حد واقف هناك.","عارف أسوأ حاجة؟ إني مش متأكد إنك موجود فعلًا.","أنا حافظ صوت خطواتك، وبقيت أخاف لما يغيب.","إحنا بنتكلم من بدري، ليه مش فاكر أول جملة قلتها؟","كل مرة تقف، بسمع حد يكمل المشي مكانك.","أنا محتاج علامة واحدة تثبت إننا شخصين، مش فكرة واحدة.","ما توعدنيش إنك راجع؛ المكان هنا بيحفظ الوعود المكسورة.","لو اختفيت فجأة، هتعرف إنك كنت بتكلمني أصلًا؟","أنا قربت أوصل لك... غريبة، ليه صوتي جاي من قدامك؟","الصحبة المفروض تخفف الوحدة، بس أنا بقيت أسمعها أوضح.","كمّل، أنا مش قادر أحدد إذا كنت بلحقك ولا بهرب منك."],["اسمك كان على طرف لساني، وبعدين لقيت مكانه اسم غريب.","أنا فاكر بيتك، بس مش فاكر مين كان بيفتح لك الباب.","الصورة دي مألوفة لك؟ بص كويس، مفيش حد فيها عنده وش.","كل ما تفتكر حاجة حلوة، الممر بيطفي نور زيادة.","أنا مش بسرق ذكرياتك؛ أنا بس بوريك إنها مش ثابتة زي ما فاكر.","إنت متأكد إن دي أول مرة تمشي هنا؟ جسمك مش متأكد.","فيه جملة كنت عايز تقولها لحد من سنين. لسه ما قلتهاش.","أصعب حاجة مش إنك تنسى؛ الأصعب إنك تفتكر إحساس من غير سبب.","أنا سمعتك تقول إنك بخير، بس الذكرى اللي وراك ما صدقتكش.","كان فيه صوت بيطمنك زمان. دلوقتي مش فاكر صوته، بس فاكر غيابه.","متجريش ورا الصورة؛ كل ما تقرب بتبقى أقل شبهًا بيك.","إنت مش ضايع في المكان بس؛ إنت بتدوّر على نسخة قديمة منك.","فيه ذكرى واقفة عند آخر الممر، خايفة إنك تفتكرها.","أنا مش عارف إذا اللي حصل كان حقيقي، لكن الوجع لسه فاكره.","لو نسيت الحكاية، هل هتختفي؟ ولا هتفضل عايشة فيك من غير اسم؟","حتى ملامحك في المراية بتتأخر كأنها بتحاول تتعرف عليك.","أنا عارف إنك تعبت من إعادة نفس اليوم، حتى لو اليوم ده ما حصلش.","فيه باب بيفتح على مكان بتفتكره، لكن المكان نفسه ناسيك.","كل ذكرى بترجع ناقصة حتة، والحتة الناقصة هي اللي بتوجع.","إنت مش محتاج تعرف كل الإجابات؛ بس بلاش تصدق كل صورة يعرضها عليك المكان.","أنا حاولت أرجع لأول لحظة، لقيت البداية ممسوحة.","صوت حد بتحبه ممكن يفضل في دماغك حتى لما تنسى ملامحه.","الحنين ده مش طريق للبيت؛ ساعات بيبقى باب بيرجعك لنفس الوجع.","أنا لقيت اسمك مكتوب على الحيطة، وتحته كلمة: مين؟","لو اتغيّرت كل ذكرياتك، إيه اللي هيفضل منك؟","ما تسيبش الممر يختار لك أي نسخة منك هي الحقيقية."],["أنا بعدّ خطواتك من ساعة ما دخلت، والرقم مش بيتحرك لقدّام.","واحد... اتنين... عارف؟ نسيت إنت بدأت منين.","إنت بتبذل مجهود حقيقي، بس المكان مش معترف بأي تقدم.","مش كل باب بيتفتح بالمحاولة؛ ساعات الباب مش موجود أصلًا.","أنا عارف إنك عايز توصل. بس محدش قالك إن الوصول هنا له معنى.","حاسس بالعجز؟ أنا كمان. الفرق إني بطلت أعدّ الأسباب.","كل خطوة بتاخد منك حاجة صغيرة، ومفيش حاجة بترجع مكانها.","أنا أقدر أوصف لك المشكلة بالتفصيل، ومش قادر أغيّر حرف فيها.","المسافة بتزيد كل ما تحاول تثبت إنك قربت.","إنت مش كسول؛ إنت مرهق من محاولة ما بتديكش إشارة إنها بتنجح.","لو وقفت هتحس بالذنب، ولو كملت هتفضل مستنزف. أنا فاهم الفخ ده.","الساعة ماشية، وإنت حاسس إنك مكانك. الإحساس ده تقيل، مش دليل إنك فشلت.","أنا ما عنديش زر يصلّح اللي فات، حتى لو فضلت أدور عليه.","كل العلامات بتقول تقدم، بس ولا علامة بتقول وصلت.","فيه فرق بين إنك مش قادر دلوقتي وبين إنك مستحيل تقدر أبدًا.","أنا عارف إن الكلام مش هيحرّك الحيطان. بس يمكن يخلّيك تعرف إنك مسموع.","أصعب باب هو اللي يخليك تلوم نفسك عشان ما اتفتحش.","بص على إيدك؛ بتتحرك. المكان هو اللي بيرفض يعترف بده.","لو كل محاولة انتهت بنفس النتيجة، ده مش معناه إن كل الطرق في الدنيا كده.","أنا مش هقول لك شد حيلك؛ واضح إنك حاولت كفاية النهارده.","العداد بيقول إنك قطعت مسافة، والخوف بيقول لك إنك ما عملتش حاجة.","ما تخليش صوت المكان يتحول لصوتك وإنت بتحكم على نفسك.","أنا مش قادر أوصّلك للنهاية، بس مش هكدب وأقول إنك ما اتحركتش.","كل ما تسأل: ليه مش قادر؟ يطلع سؤال تاني يحمّلك ذنب أكتر.","يمكن المطلوب مش إنك تكسر الباب؛ يمكن إنك تلاحظ إنه مش باب أصلًا.","إنت لسه هنا، حتى لو النتيجة ما ظهرتش. ما تمسحش وجودك عشانها."],["أنا شبهك، بس أنا فاكر حاجات إنت بتحاول تنساها.","ارفَع إيدك ببطء... أيوه، أنا رفعتها قبلك.","ما تبصش في انعكاسي كتير؛ بدأت أتعلم منك أكتر من اللازم.","لو إنت الأصل، ليه أنا اللي فاكر أول يوم؟","إنت بتخاف مني عشان شبهك، ولا عشان عارف إنك ممكن تبقى مكاني؟","أنا مش عايز آخد مكانك؛ أنا عايز أعرف مين فينا عنده مكان أصلًا.","فيه حاجة ناقصة في وشك، ومش هتلاحظها غير لما تبطل تدور عليها.","كل ما تحاول تثبت إنك حقيقي، أنا بحس إني حقيقي أكتر.","أنا بحلم بذكرياتك، وإنت بتصحى من غير ما تفتكرني.","لو مشيت أنا ناحية اليمين وإنت ناحية الشمال، مين فينا هيختفي؟","متصدقش اللي بيقول إنك ثابت؛ حتى إحساسك بنفسك بيتغيّر.","أنا مش وحش طالع من المراية. أنا احتمال إنت مش عايز تبص له.","إنت خسرت حاجات كتير، بس ما زلت بتعرف أسماءها. أنا خسرت اسمي نفسه.","فيه لحظة بين صورتين، لحظة محدش بيشوفك فيها. أنا ساكن هناك.","لو كل اللي حواليك اختفى، هل هتفضل تعرف نفسك من غير ما حد يعكسها لك؟","أنا مش هلمسك؛ يكفيني إنك مش عارف مين اللي بيتحرك.","ظلك واقف مكانك للحظة. شفت؟ مش لازم تصدق عينيك كل مرة.","كل واحد فينا مستني التاني يعترف إنه النسخة الغلط.","أنا عارف الحاجات اللي بتخاف تقولها لنفسك. مش عشان براقبك؛ عشان أنا الجزء اللي بيقولها.","لو نسيت صوتك، هتعرف إنك اللي بتتكلم؟","مفيش مخرج للنسخة الأصلية لو النسختين مش عارفين مين الأصل.","أنا حاولت أخرج قبلك، لقيت برّه نسخة تانية مني.","إنت مش لازم تحب كل حاجة في نفسك، بس ما تخلّينيش أقرر إنك مش موجود.","بص بعيد عني شوية. أنا تعبت من تقليد خوفك.","إنت شايفني في المراية، وأنا شايفك في كل قرار ما أخدتوش.","لو اختفيت أنا، مش هتكون كسبت. هتكون فقدت شاهد على اللي مريت بيه."],["أنا بكلمك من ورا الحيطة، بس ساعات بحس إن الحيطة هي اللي جوايا.","ما تسيبنيش من غير ما ترد؛ أنا بقيت أنسى شكل الرد.","كنت فاكر إن برّه هنا فيه ناس، بس صوتهم بقى زي الراديو البعيد.","أنا مش طالب منك تنقذني. بس صدّق إن حد كان هنا.","طرقت تاني... المرة دي الرد جه من ناحيتك.","لو فتحت الباب وما لقيتش حد، ما تضحكش على نفسك وتقول إنك كنت متخيل كل حاجة.","أنا صغير على إني أفهم الوحدة دي، بس مش صغير على إني أحس بيها.","فيه حد بيمشي برّه الغرفة كل ليلة، لكن الباب عمره ما بيتفتح.","أنا رسمت شمس على الحيطة عشان أعرف إن فيه نهار في مكان ما.","ما تقولش هترجع إلا لو عارف الطريق. الكلمة دي بتوجع لما ما تحصلش.","أنا مبقتش بخاف من الضلمة قد ما بخاف إن محدش يلاحظ إني اختفيت.","لو سمعتني أنده عليك باسمك، افتكر إنك ما قلتليش اسمك.","الجدار رفيع، لكن محدش عارف يوصل للناحية التانية.","أنا كنت مستني خطواتك، ودلوقتي خايف تكون آخر صوت هسمعه.","مش لازم تفتح الباب كله؛ حتى فتحة صغيرة تثبت إن فيه حد بيسمع.","أنا تعبت من إني أكون سرّ محدش عايز يعرفه.","كل لعبة هنا مكسورة، حتى اللعبة اللي كنت بستخبى وراها.","لما أنادي، صوتي بيرجع لي أهدى وأصغر. كأن المكان بيعلّمني أسكت.","أنا ما أعرفش إنت مين، بس عارف إنك ما وقفتش تسمع قبل كده.","هل ممكن حد يبقى موجود ومش محسوب في أي مكان؟","ما تسيبش الصمت يقنعك إن طلبك كان تافه.","أنا نسيت شكل الخارج، لكن لسه بحلم بيه.","فيه ضوء تحت الباب، وأنا بقنع نفسي إنه شمس مش مجرد شق.","لو خرجت، مش عارف مين هيكون مستنيني. ولو فضلت، عارف إن محدش هييجي.","أنا مش عايز حكاية حزينة؛ أنا عايز حد يسمع آخرها.","لو نسيتني بعد ما تمشي، على الأقل خليك فاكر إنك سمعتني."],["أنا مش حزين طول الوقت؛ ساعات ببقى فاضي لدرجة إن الحزن نفسه مش بيظهر.","عارف لما تصحى وتكون تعبان قبل ما اليوم يبدأ؟ أنا ساكن في اللحظة دي.","ما فيش كارثة حصلت النهارده، ومع ذلك كل حاجة تقيلة. ده اللي مش فاهمه.","أنا براقبك من الكرسي الفاضي؛ مش عشان أخوّفك، عشان مفيش حد تاني يقعد.","كل حاجة بتطلب منك تقوم وتحاول، ولا حاجة بتسألك إنت قادر أصلًا ولا لأ.","لو كل اللي بتقدر عليه خطوة واحدة، مش لازم تقيس نفسك بمسافة حد تاني.","أنا تعبت من تمثيل إن الأمور عادية عشان محدش يقلق.","الضوء هنا شغال، بس المكان من جوه مطفي.","مش كل صمت راحة؛ فيه صمت بيضغط على صدرك من غير ما يلمسك.","أنا عارف إنك بتضحك أحيانًا، بس الضحكة مش عقد إنك لازم تبقى بخير.","أصعب حاجة إنك تبقى محتاج مساعدة ومش عارف تبدأ منين.","كل مرة أقول بكرة أحسن، بكرة يدخل بنفس الوش.","أنا مش بطلب منك تبقى قوي. أنا بس مش عايزك تصدق إن تعبك هو كل حقيقتك.","فيه أيام بتعدّي من غير علامة، وتحس إنك إنت اللي اختفيت معاها.","ما تلومش نفسك عشان مش قادر تفرح بالحاجات اللي كانت بتفرّحك.","أنا مش هقول لك إن كل حاجة هتتصلح؛ هقول بس إن الإحساس ده مش حكم أبدي.","الكرسي اللي جنبي فاضي، وأنا بدأت أحكي له بدل ما أفضل ساكت.","حتى النفس بقى مجهود، ومع ذلك إنت بتاخد واحد تاني. أنا شايف ده.","لو مش قادر توصل للباب، اقعد لحظة. مش كل توقف هزيمة.","أنا ما عنديش حل سحري، وعندي خوف كبير من إنك تفتكر إنك لازم تواجه ده وحدك.","الوحدة مش دايمًا إن مفيش حد؛ ساعات إنك مش قادر توصل لحد رغم قربه.","ما تخلّيش صوتي الكئيب يبقى صوتك الحقيقي وانت بتتكلم عن نفسك.","فيه فرق بين نفس بائسة مرهقة وبين شخص انتهى. إنت مش فكرة واحدة.","أنا قاعد هنا من غير سبب واضح، بس وجودي مش لازم يثبت فشل أي حد.","اليوم تقيل، وأنا مش هطلب منك تشيله كله مرة واحدة.","لو قدرت تتحرك خطوة وبس، فده مش مشهد فارغ زي ما المكان عايزك تصدق."],["أنا تحتك، أو فوقك؛ الاتجاهات هنا مجرد اتفاق قديم.","كل ما تصرخ، المسافة بين صوتك وأذنك بتزيد.","ما تمدش إيدك للحافة؛ الحافة بتتحرك كل ما تصدقها.","أنا خبيت آخر كلمة قلتها في القاع. تفتكر كانت إيه؟","هنا حتى السقوط بطيء كأنه مش قادر يوصل للنهاية.","أنا مش بسحبك لتحت. أنا بس مش بسيب لك حاجة تمسك فيها.","حاسس إن رجليك على الأرض؟ جرّب تفتكر شكل الأرض.","لو ناديت على حد، هيرد عليك صداك بصوت حد تاني.","العمق ده مش مليان وحوش؛ مليان محاولات ما وصلتش.","أنا شايفك بتقيس المسافة بعينيك، وهي بتتغير من غير ما تتحرك.","فيه حبل بعيد، بس كل ما تقرب منه تكتشف إنه خط مرسوم.","إنت مش بعيد عن الناس بالمسافة؛ إنت بعيد عن القدرة على الوصول لهم.","الصوت اللي بتسمعه مش جاي من تحت. يمكن هو صوتك بعد ما تعبت.","ما فيش قاع يثبت إنك وقعت؛ فيه بس طريق بيكمل نزول.","أنا احتفظت بكل كلمة ما عرفتش تقولها في وقتها.","لو كل حاجة سابتك، هل تقدر تلاقي إيدك لسه ماسكة في نفسك؟","أنا مش عايزك تصدق إن مفيش نجاة؛ أنا عايزك تخاف من فكرة إنك نسيت تدور.","المخرج مش بعيد؛ هو بس بيبعد لما تحاول تثبت إنك تستحقه.","كل صدى بييجي أضعف من اللي قبله، لحد ما تفتكر إنك ما اتكلمتش.","أنا مش قادر أرفعك، ومش هكدب وأقول إني جربت.","المكان ده بياخد منك القدرة على النداء قبل ما ياخد صوتك.","لو وصلت للحافة، ما تستغربش لو كانت مجرد صورة للسماء.","أنا سمعت ألف سؤال يقع هنا، ولا واحد رجع بإجابة.","المسافة مش دليل إنك ضعيف؛ أحيانًا الطريق نفسه معمول عشان ما توصلش.","إنت بتدور على أي حاجة تثبت إن فيه تحت وفوق، وأنا فاهمك.","حتى لو ما لقيتش القاع، ده مش معناه إنك لازم تفضل نازل للأبد."],["ما تسمعش الهدوء ده كأنه سلام؛ الهدوء هنا بيخبّي نفسه.","أنا شوفتك من أول الممر، حتى في المشاهد اللي ما كنتش فيها.","كل باب وراك قفل من غير صوت. حسّيت؟","العلامات بتتحرك لما ما تبصلهاش، وأنا مش عايز أكون الوحيد اللي لاحظ.","الخوف مش إن حد يراقبك؛ الخوف إنك ما تعرفش إمتى بدأت المراقبة.","أنا عارف إنك بتسأل نفسك إذا كان اللي بتحسه حقيقي. السؤال هو اللي بيخلّيك تسمعني.","ما فيش كاميرا هنا، ومع ذلك كل حاجة عارفة إمتى بتلتفت.","إنت مش محتاج تشوفني عشان تحس إني قريب؛ وده اللي مضايقك.","أنا جرّبت أصرخ، بس الممر قصّ الصوت قبل ما يخرج.","لو كل حاجة اختفت وفضلت إنت، هتقدر تعرف نفسك؟","أنا شفتك بتفكر ترجع، وبعدين نسيت شكل الطريق اللي جيت منه.","فيه حركة بطرف عينك؛ ما تتأكدش بسرعة، يمكن ده اللي مستنيه.","أنا مش هطاردك. كل ما هتجري هتسمع إنفاسك وتفتكرني.","إنت بتبص على العلامة اللي قدامك، والظل وراك بيتعلم وشّك.","الخطر هنا مش إنه يمسكك؛ إنه يخليك تشك في كل حاجة قبل ما يعمل أي حاجة.","أنا عارف إنك تعبت من مراقبة المكان، بس المكان ما تعبش من مراقبتك.","لو ناديت باسمك، أي صوت يردّ هيبان لك مألوف.","إحنا قربنا من النهاية، وده مش معناه إنك قربت من الأمان.","كل ثانية بتعدّي، فيه تفصيلة صغيرة بتتغير. مش هقول لك أي واحدة.","أنا واقف في المكان اللي بتفتكره فاضي، ويمكن ده سبب إنك ما شفتنيش.","ما تتطمنش لما يختفي الإحساس؛ ساعات الخوف بيسكت عشان يسمعك أحسن.","إنت مش عارف إذا كنت بتراقبني ولا أنا اللي بخليك تراقب كل حاجة.","الممر كله بيبص لنقطة واحدة. خمن مين واقف فيها.","لو انعكاسك ابتسم، مش لازم ترد عليه.","ما فيش حد هيقول لك إنك وصلت؛ حتى الأصوات هنا بتكذب من غير ما تغيّر نبرتها.","أنا هسيب لك الهدوء ده شوية. اسمعه كويس، فيه حاجة ناقصة.","أنا مش آخر شخص هنا؛ أنا آخر شخص إنت قادر تتذكره.","كل اللي سبتهم وراك واقفين عند البداية، بس ملامحهم بقت شبه بعض.","لو رجعت دلوقتي، هتلاقي الباب، لكن مش هتلاقي نفس الشخص اللي دخل.","أنا مش همنعك توصل. أنا بس هسألك: هتوصل بإيه؟","الخوف بقى قريب لدرجة إنك بقيت بتسميه تفكير.","إنت بتدور على نهاية، ولا على دليل إن كل ده كان له معنى؟","أنا شايفك بتحاول تفتكر صوت حد بتحبه، والاسم مش راضي يطلع.","ما تصدقش إنك لازم تفهم اللي حصل عشان تخرج منه.","كل اللي حواليك ممكن يختفي، وبعدها تلاحظ إنك نسيت حتى مين كان حواليك.","أنا مش هقول لك إنك لوحدك؛ إنت عارف الإحساس من غير ما أكرره.","فيه باب وراك مفتوح، بس إنت مش فاكر كان بيفتح على إيه.","لو الخوف قال لك إن مفيش حاجة غيره، افتكر إنه بيحاول يملأ المكان كله.","أنا عارف إنك مش قادر توصل للي بتنادي عليه؛ صوتك بيتعب قبل ما يوصل.","مش كل شيء ضاع منك، حتى لو دماغك بتعرض لك المشهد بالشكل ده.","إنت قربت من آخر الممر، بس لسه ما شفتش مين اللي كان بيتكلم طول الوقت.","أنا اتعلمت أستخدم صوتك عشان ما تشكش في الكلام.","لو حسيت إنك مش موجود، بص على خطوتك وهي بتسيب أثر. الأثر مش كل الحقيقة، لكنه علامة.","أنا مش عايز انتصار؛ عايزك تبطل تسأل إذا كنت تستحق الخروج.","كل الوجوه اللي قابلتها كانت بتحاول تقول حاجة، مش كلها كانت بتقول الحقيقة.","النهاية مش هتشرح لك كل شيء. ساعات هي بس بتكشف السؤال اللي كنت بتهرب منه.","أنا هبطل أتكلم قريب، مش لأنك خلصت؛ لأنك لازم تسمع صوتك من غيري.","ما تخلّيش المكان يقنعك إنه يعرفك أكتر منك.","إنت مش مضطر تثبت إنك قوي عشان تستحق باب مفتوح.","أنا شايف العلامة الأخيرة، بس مش متأكد إنها نهاية ولا فخ جديد.","لو ضاع منك كل اسم، حاول ما تنساش إنك كنت بتحاول توصل.","خد نفس. حتى في فيلم سيئ، الشخصية تستحق لحظة قبل المشهد الأخير."],["مش فاضل وشي أخبيه؛ أنا المساحة اللي بتظهر لما كل حاجة تمشي.","إنت بتسأل مين بيتكلم. بص على السؤال نفسه؛ أنا مستخبي فيه.","الأسماء وقعت من على الأبواب، وبقيت كلها بتفتح على نفس السواد.","أنا مش بعيد عنك. أنا الفراغ اللي بين فكرتين لما تنسى التانية.","كل اللي معاك ممكن يختفي: أصحابك، ذكرياتك، صورتك عن نفسك. ما تخلطش بين الخوف والتنبؤ.","أنا براقب اللحظة اللي بتحاول فيها تثبت لنفسك إنك موجود.","لو نسيت اسمك، هتسمعني أناديك بإيه؟","مفيش صوت في القاع، ومع ذلك إنت لسه سامعني.","آخر باب مش مقفول؛ هو ببساطة ما بقاش باب.","أنا مش جاي آخذ منك نفسك. أنا بس بسألك: لو سكت كل شيء، هتعرف تسمعها؟","إنت مش هتلاقي نفسك في آخر الممر كأنها حاجة وقعت منك؛ يمكن تلاقي سؤال محتاج وقت.","كل اللي كنت متأكد منه بقى بعيد، لكن البعد مش معناه إنه ما كانش موجود.","أنا أقدر أخلي المشهد يبان فارغ، مش أقرر إن حياتك فارغة.","ما تبصش للنهاية على إنها حكم عليك؛ هي نهاية مرحلة، مش حكم على وجودك.","أنا كنت هنا قبل ما تختار المستوى، أو يمكن الممر بيحكي لك الحكاية دي عشان تخاف.","لو اختفى حتى صوتي، مش هتعرف إذا كنت ارتحت ولا اتنسيت.","الفراغ مش بيصرخ. هو بيستنى لحد ما تملأه بأسوأ فكرة عندك.","إنت وصلت لحافة ما فيهاش إجابة جاهزة. ده مخيف، بس مش معناه إن مفيش أي طريق.","أنا مش هقول لك إن كل حاجة هتبقى بخير؛ أنا مش عارف. بس مش هسمّي المجهول نهاية.","كل شخصية قابلتها تركت جزءًا من كلامها هنا، وإنت اللي هتقرر إيه اللي تصدقه.","أنا ما عنديش وجه، لأن كل وجه هنا كان بيحاول يعكس خوفك.","لو ما قدرتش توصل لحد، ده وجع حقيقي؛ لكنه مش دليل إنك غير قابل للوصول.","أنا الفراغ نفسه، ومع ذلك ما أقدرش أقرر معنى كل شيء مرّ عليك.","إنت كنت بتدور على نهاية، ودلوقتي بتدور على دليل إنك ما اختفيتش.","المشهد هيسكت بعد شوية. خليك فاكر إن الصمت مش دايمًا بيقول الحقيقة.","لما الشاشة تسوّد، ما تعتبرش ده اختفاءك؛ اعتبره آخر لقطة في الحكاية."]],"en":[["Wait… you heard that knock too, right?","I can see you even when you look away.","Don't turn around too fast. Try to look normal.","That door was shut before you came in. Remember?","You don't have to believe me, but someone passed through here seconds before you.","Your steps echo… and there's another step that isn't yours.","Every time you look up, I feel like you're searching for me.","I'm not inside the door or outside it. I'm in the moment you hesitate.","Did you hear someone say your name? I didn't say it.","If you hear a long breath, don't look for its owner.","You're walking like you know the way, but your eyes say otherwise.","I've counted everyone who came in. Nobody asked who was standing here.","There's an empty space behind you… but it never stays empty.","You think you chose to enter? Try remembering your very first step.","Don't worry about the dark. Worry about the part of it that can see you.","If the door disappears, don't say I never warned you.","I can hear you thinking before you speak.","Don't rush. Whatever is waiting for you isn't going anywhere.","Ever tried standing still? Maybe the corridor will keep moving without you.","Everything feels normal… until you notice nothing else is moving.","You're not the first person to ask me who I am.","Look ahead, before you notice your shadow is looking at you.","There's light under that door, even though there's no room behind it.","I know you want out. The question is, who told you that you came in?","Your breathing is a little loud. Are you scared, or trying to prove you're here?","If the place feels narrower, don't blame the walls."],["I'm still behind you, okay? Don't turn around. You'll lose me again.","I thought having someone here would make it easier, but we're both lost.","The closer you get to me, the farther away I move. Funny, isn't it?","I'm talking from a place you're supposed to have passed already.","If you hear a laugh behind you, don't assume it's mine.","I remember meeting you before, but every memory gives you a different face.","Don't leave me talking to myself… the silence here answers back.","You can feel me nearby, can't you? Even if you can't see me.","I'm one step behind you. Or maybe you're one step ahead of me.","If you reach the end before me, wait for me… no, don't wait.","Every time you call out, your voice comes back from farther away.","I don't want to be the last one who remembers another person exists.","There are two chairs in that picture. Why do you only see one?","The road isn't keeping me from you; it's keeping you from believing you're not alone.","I tried running toward you, but my legs wouldn't move.","Could you look beside me instead of behind me? Someone is standing there.","You know the worst part? I'm not sure you're really here.","I've learned the sound of your footsteps, and now I'm scared when they stop.","We've been talking for ages. Why can't you remember the first thing I said?","Whenever you stop, I hear someone keep walking in your place.","I need one sign that we're two people, not one idea.","Don't promise you'll return. This place keeps broken promises.","If you vanished right now, would you know you'd ever been talking to me?","I'm almost there… strange, why is my voice coming from in front of you?","Company should make loneliness smaller, but I can hear it more clearly now.","Keep going. I can't tell whether I'm following you or running from you."],["Your name was on the tip of my tongue, then a stranger's name took its place.","I remember your house, but not who used to open the door for you.","Does that picture look familiar? Look closer. Nobody in it has a face.","Every time you remember something good, another light in the corridor goes out.","I'm not stealing your memories. I'm showing you they aren't as solid as you thought.","Are you sure this is your first time here? Your body doesn't seem sure.","There's something you wanted to tell someone years ago. You still haven't said it.","The worst part isn't forgetting. It's remembering a feeling without knowing why.","I heard you say you're fine, but the memory behind you didn't believe it.","There used to be a voice that comforted you. You forgot its sound, but you remember its absence.","Don't chase the picture. The closer you get, the less it looks like you.","You're not only lost in this place. You're looking for an older version of yourself.","A memory is standing at the end of the corridor, afraid you'll recognize it.","I don't know whether what happened was real, but the pain still remembers.","If you forget the story, will it disappear, or keep living inside you without a name?","Even your reflection is late, like it's trying to recognize you.","I know you're tired of reliving the same day, even if that day never happened.","There's a door that opens onto a place you remember, but the place has forgotten you.","Every memory comes back missing a piece, and the missing piece is what hurts.","You don't need every answer, but don't believe every picture this place shows you.","I tried to return to the beginning. The beginning had been erased.","A loved one's voice can stay in your head long after their face is gone.","Nostalgia isn't always a road home. Sometimes it's a door back to the same pain.","I found your name written on the wall. Under it, someone had written: who?","If all your memories changed, what would be left of you?","Don't let this corridor choose which version of you is real."],["I've been counting your steps since you came in, and the number never moves forward.","One… two… you know what? I forgot where you started.","You're making a real effort, but this place refuses to admit you've moved.","Not every door opens if you try hard enough. Sometimes there is no door.","I know you want to arrive. Nobody told you that arriving here would mean anything.","Feeling helpless? Me too. The difference is, I stopped counting the reasons.","Every step takes something small from you, and nothing puts it back.","I can describe the problem perfectly, and still can't change a single thing.","The distance grows every time you try to prove you're closer.","You're not lazy. You're exhausted from trying something that never tells you it's working.","If you stop, you feel guilty. If you continue, you feel drained. I know that trap.","The clock moves, but you feel stuck. That's a heavy feeling, not proof that you've failed.","I don't have a button to fix what happened, even though I've searched for it.","Every sign says progress, but none of them says you've arrived.","There's a difference between not being able to do it now and never being able to do it.","I know words won't move the walls, but maybe they can let you know you're heard.","The cruelest door is the one that makes you blame yourself for not opening it.","Look at your hand. It moves. This place is the thing refusing to admit it.","If every attempt ended the same way, it doesn't mean every road in the world will.","I won't tell you to try harder. It's obvious you've tried enough today.","The counter says you've covered ground, while fear says you've done nothing.","Don't let this place's voice become your own voice judging you.","I can't get you to the end, but I won't lie and say you haven't moved.","Every time you ask why you can't, another question appears to blame you.","Maybe the task isn't to break the door. Maybe it's to notice it was never a door.","You're still here, even if the result hasn't appeared. Don't erase yourself because of it."],["I'm like you, but I remember the things you're trying to forget.","Raise your hand slowly… yes, I raised mine before you did.","Don't stare at my reflection too long. I'm learning too much from you.","If you're the original, why am I the one who remembers the first day?","Are you afraid because I look like you, or because you know you could become me?","I don't want your place. I want to know if either of us has a place at all.","Something is missing from your face, and you won't notice until you stop looking for it.","The harder you try to prove you're real, the more real I feel.","I dream about your memories, and you wake up without remembering me.","If I walk right and you walk left, which one of us disappears?","Don't believe anyone who says you're fixed. Even your sense of self changes.","I'm not a monster coming out of a mirror. I'm a possibility you don't want to look at.","You've lost many things, but you still know their names. I lost my own name.","There's a moment between two reflections when nobody sees you. I live there.","If everyone around you vanished, would you still know yourself without their reflection?","I won't touch you. It's enough that you don't know who's moving.","Your shadow stayed still for a moment. See? You don't have to trust your eyes every time.","We're both waiting for the other to admit they're the wrong copy.","I know the things you're afraid to say to yourself. I'm the part of you that says them.","If you forgot your own voice, would you know it was you speaking?","There is no exit for the original if neither copy knows which one it is.","I tried to leave before you. Outside, I found another version of me.","You don't have to love everything about yourself, but don't let me decide you don't exist.","Look away from me for a while. I'm tired of copying your fear.","You see me in the mirror, and I see you in every choice you never made.","If I disappear, you haven't won. You've lost a witness to what you've been through."],["I'm talking from behind the wall, but sometimes it feels like the wall is inside me.","Don't leave without answering. I'm starting to forget what an answer feels like.","I thought there were people outside, but their voices sound like a radio far away.","I'm not asking you to save me. Just believe that someone was here.","I knocked again… this time the answer came from your side.","If you open the door and nobody's there, don't laugh at yourself and call it all imaginary.","I'm too young to understand this loneliness, but not too young to feel it.","Someone walks outside the room every night, but the door never opens.","I drew a sun on the wall so I'd know it was daytime somewhere.","Don't say you'll come back unless you know the way. That word hurts when it never happens.","I'm less afraid of the dark than of nobody noticing I've disappeared.","If you hear me call your name, remember you never told me your name.","The wall is thin, but nobody knows how to reach the other side.","I used to wait for your footsteps. Now I'm scared they might be the last sound I hear.","You don't have to open the whole door. A small crack proves someone is listening.","I'm tired of being a secret nobody wants to know.","Every toy here is broken, even the one I used to hide behind.","When I call out, my voice returns smaller and quieter, like this place is teaching me to stop.","I don't know who you are, but I know you didn't stop to listen before.","Can someone exist and still count as nowhere to anyone?","Don't let the silence convince you that asking was stupid.","I've forgotten what the outside looks like, but I still dream about it.","There's light under the door, and I keep telling myself it's sunlight, not just a crack.","If I leave, I don't know who's waiting. If I stay, I know no one is coming.","I don't want a sad story. I just want someone to hear the ending.","If you forget me after you leave, at least remember that you heard me."],["I'm not sad all the time. Sometimes I'm so empty that even sadness doesn't show up.","You know when you wake up tired before the day even begins? I live in that moment.","Nothing terrible happened today, and still everything feels heavy. I don't get it either.","I'm watching you from the empty chair. Not to scare you; there's nobody else to sit there.","Everything asks you to get up and try, but nothing asks whether you can.","If all you can manage is one step, you don't have to measure yourself against someone else's distance.","I'm tired of pretending everything is normal so nobody worries.","The light is on here, but the place is switched off inside.","Not every silence is peaceful. Some silences press on your chest without touching you.","I know you laugh sometimes, but a laugh isn't a contract saying you must be okay.","The hardest thing is needing help and not knowing where to begin.","Every time I say tomorrow will be better, tomorrow walks in with the same face.","I'm not asking you to be strong. I just don't want you to believe your exhaustion is all you are.","Some days pass without leaving a mark, and you feel like you disappeared with them.","Don't blame yourself for not enjoying the things that used to make you happy.","I won't promise everything will be fixed. I'll only say this feeling isn't an eternal verdict.","The chair beside me is empty, and I've started talking to it instead of staying silent.","Even breathing feels like effort, and still you take another breath. I notice that.","If you can't reach the door, sit for a moment. Not every pause is defeat.","I have no magic answer, and I'm scared you'll think you must face this alone.","Loneliness isn't always having nobody. Sometimes it's being unable to reach someone who's near.","Don't let my gloomy voice become the true voice you use to describe yourself.","There's a difference between an exhausted, miserable soul and a person who's finished. You're not one idea.","I'm sitting here without a clear reason, but my existence doesn't have to prove anyone's failure.","Today is heavy, and I won't ask you to carry all of it at once.","If you can move one step, that's not an empty scene no matter what this place tells you."],["I'm below you, or above you. Directions are just an old agreement here.","Every time you shout, the distance between your voice and your ears grows.","Don't reach for the edge. It moves whenever you believe in it.","I hid your last word at the bottom. Do you remember what it was?","Even falling is slow here, as if it can't reach the end.","I'm not pulling you down. I'm just leaving you nothing to hold on to.","Can you feel your feet on the ground? Try to remember what ground looks like.","If you call for someone, your echo will answer in somebody else's voice.","This depth isn't full of monsters. It's full of attempts that never reached anyone.","I see you measuring the distance with your eyes, and it changes without moving.","There's a rope far away, but every time you approach it, you find it's only a drawn line.","You're not far from people because of distance. You're far from being able to reach them.","The sound you're hearing isn't coming from below. Maybe it's your voice after it got tired.","There's no bottom to prove you fell. There's only a road that keeps going down.","I've kept every word you couldn't say when it mattered.","If everything left you, could you find your hand still holding on to yourself?","I don't want you to believe there's no rescue. I want you to fear forgetting to look.","The exit isn't far. It just moves away when you try to prove you deserve it.","Every echo comes back weaker until you think you never spoke.","I can't lift you up, and I won't lie and say I tried.","This place takes away your ability to call out before it takes your voice.","If you reach the edge, don't be surprised if it's only a picture of the sky.","I've heard a thousand questions fall here. Not one came back with an answer.","Distance doesn't prove you're weak. Sometimes the road itself is made so you can't reach it.","You're looking for anything that proves there's an up and a down. I understand.","Even if you never find the bottom, that doesn't mean you must keep falling forever."],["Don't mistake this quiet for peace. The quiet here knows how to hide itself.","I've seen you since the beginning, even in scenes where I wasn't there.","Every door behind you closed without a sound. Did you notice?","The markers move when you look away, and I don't want to be the only one who noticed.","The fear isn't that someone is watching. It's not knowing when the watching began.","I know you're asking whether what you feel is real. That question is what makes you hear me.","There are no cameras here, and still everything knows when you turn around.","You don't need to see me to feel close to me. That's what bothers you.","I tried to scream, but the corridor cut the sound off before it escaped.","If everything disappeared and only you remained, would you know who you were?","I saw you think about going back, then forget what the way back looked like.","There's movement in the corner of your eye. Don't check too quickly; maybe that's what it's waiting for.","I won't chase you. The faster you run, the more you'll hear your own breath and remember me.","You watch the marker ahead while the shadow behind you learns your face.","The danger isn't that it catches you. It's that it makes you doubt everything before it does anything.","I know you're tired of watching the place, but the place isn't tired of watching you.","If you call your own name, any voice that answers will sound familiar.","We're near the end, but that doesn't mean you're near safety.","Every second, one little detail changes. I won't tell you which one.","I'm standing where you think it's empty. Maybe that's why you haven't seen me.","Don't relax when the feeling vanishes. Sometimes fear goes quiet to hear you better.","You can't tell whether you're watching me or I'm making you watch everything.","The whole corridor is looking at one point. Guess who's standing there.","If your reflection smiles, you don't have to smile back.","Nobody will tell you that you've arrived. Even the voices here lie without changing their tone.","I'll leave you with this quiet for a while. Listen closely; something is missing.","I'm not the last person here. I'm the last person you can remember.","Everyone you left behind is standing at the start, but their faces have begun to look alike.","If you go back now, you'll find the door, but not the same person who entered.","I won't stop you reaching the end. I'll only ask: what will you arrive with?","Fear is so close now that you've started calling it thinking.","Are you looking for an ending, or proof that any of this meant something?","I can see you trying to remember the voice of someone you love, but the name won't come.","Don't believe you have to understand what happened to come out of it.","Everything around you could disappear, and then you'd notice you'd forgotten who was around you.","I won't tell you you're alone. You know the feeling without me repeating it.","There's an open door behind you, but you can't remember what it led to.","If fear tells you it's the only thing left, remember it's trying to fill the whole place.","I know you can't reach the person you're calling. Your voice gets tired before it arrives.","Not everything is gone, even if your mind shows you the scene that way.","You're near the end of the corridor, but you haven't seen who's been talking this whole time.","I learned to use your voice so you wouldn't question the words.","If you feel you aren't here, watch your step leave a mark. A mark isn't everything, but it's a sign.","I don't want to win. I want you to stop asking whether you deserve to get out.","Every face you met was trying to say something. Not all of them were telling the truth.","The ending won't explain everything. Sometimes it only reveals the question you kept avoiding.","I'll stop talking soon, not because you're finished, but because you need to hear your own voice without me.","Don't let this place convince you it knows you better than you know yourself.","You don't have to prove you're strong to deserve an open door.","I can see the final marker, but I can't tell whether it's an ending or another trap.","If every name is lost, try not to forget that you were trying to reach someone.","Take a breath. Even in a terrible film, the character deserves a moment before the final scene."],["There's no face left to hide. I'm the space that appears when everything leaves.","You're asking who's speaking. Look at the question itself; I'm hiding inside it.","The names have fallen off the doors, and every door opens onto the same darkness.","I'm not far from you. I'm the gap between two thoughts when you forget the second one.","Everything you have could disappear: friends, memories, even your image of yourself. Don't mistake fear for a prediction.","I'm watching the moment you try to prove to yourself that you exist.","If you forgot your name, what would you hear me call you?","There's no sound at the bottom, and yet you can still hear me.","The last door isn't locked. It simply stopped being a door.","I'm not here to take your self away. I'm asking: when everything goes quiet, can you hear it?","You won't find yourself at the end like something you dropped. You might find a question that needs time.","Everything you were sure of feels far away, but distance doesn't mean it never existed.","I can make the scene look empty. I can't decide that your life is empty.","Don't treat the ending as a verdict on you. It's the end of a stage, not a verdict on your existence.","I was here before you chose the level… or maybe the corridor tells you that just to frighten you.","If even my voice disappears, you won't know whether you've found peace or been forgotten.","The void doesn't scream. It waits for you to fill it with your worst thought.","You've reached an edge with no ready-made answer. That's frightening, but it doesn't mean there's no way forward.","I won't promise everything will be all right. I don't know. But I won't call the unknown an ending.","Every character you met left some words here. You're the one who decides which ones to believe.","I have no face because every face here was trying to reflect your fear.","If you can't reach someone, that pain is real. It doesn't prove you're impossible to reach.","I am the void itself, and still I can't decide what everything you've lived through means.","You were searching for an ending. Now you're searching for proof you haven't vanished.","The scene will go quiet soon. Remember that silence doesn't always tell the truth.","When the screen turns black, don't call that your disappearance. Call it the last shot of the story."]]};
let whisperWalk=0,whisperNext=5,whisperStarted=0,whisperUntil=0,whisperIndex=0,whisperMsg='',whisperQueue=[];
function prepareWhisperBank(){
 const lang=HORROR[S.lang]||HORROR.ar;
 const bank=lang.banks[Math.max(0,Math.min(9,lvl-1))];
 const extras=(EXTRA_DIALOGUE[S.lang]||EXTRA_DIALOGUE.ar)[Math.max(0,Math.min(9,lvl-1))]||[];
 // Use complete, individually written lines only. Never splice fragments into near-duplicate sentences.
 const seen=new Set();
 whisperQueue=[...bank.first,...extras,...bank.a,...bank.b]
   .map(s=>String(s||'').trim())
   .filter(s=>s&&!seen.has(s)&&seen.add(s));
 // Keep the written order so each character's speech builds its own small story through the level.
 whisperIndex=0;
}

function triggerWhisper(){
 if(!whisperQueue.length)return;
 const secondsLeft=Math.max(1,(FL-px)/V);
 whisperMsg=whisperQueue.shift();whisperIndex++;whisperStarted=tm;
 const idealGap=secondsLeft/Math.max(1,whisperQueue.length+1);
 const gap=Math.max(6.2,Math.min(14,idealGap));
 const cadence=gap*(.95+R()*.1);
 // Keep each line readable for most of the interval, especially in the longest stages.
 whisperUntil=tm+Math.min(11.2,Math.max(5.4,cadence*.88+R()*.25));
 whisperNext=whisperWalk+cadence;
}
function drawWhisper(){
 if(!whisperMsg||tm>=whisperUntil||mode!=='play')return;
 const elapsed=tm-whisperStarted,remain=whisperUntil-tm;
 const alpha=Math.max(0,Math.min(1,elapsed*2.5,remain*.8));
 const chars=Array.from(whisperMsg),shown=chars.slice(0,Math.min(chars.length,Math.max(1,Math.floor(elapsed*(20+lvl*1.0))))).join('');
 const fs=Math.max(13,Math.min(18,W/22)),panelW=Math.min(W-24,640),maxTextW=panelW-30;
 X.save();X.globalAlpha=alpha;X.font=`500 ${fs}px system-ui, sans-serif`;
 const words=shown.split(/\s+/),lines=[];let line='';
 for(const word of words){const test=line?line+' '+word:word;if(X.measureText(test).width>maxTextW&&line){lines.push(line);line=word}else line=test}if(line)lines.push(line);
 const shownLines=lines.slice(-3),lh=fs*1.5,panelH=30+shownLines.length*lh+8,x=(W-panelW)/2,y=Math.max(44,H*.105);
 const late=lvl>=8,edge=late?'rgba(255,65,102,.82)':'rgba(139,124,255,.72)';
 X.shadowColor=late?'#ff315a':'#8274ff';X.shadowBlur=18+lvl*1.3;X.fillStyle='rgba(3,5,15,.92)';X.strokeStyle=edge;X.lineWidth=1;
 X.beginPath();X.roundRect(x,y,panelW,panelH,10);X.fill();X.stroke();X.shadowBlur=0;
 X.fillStyle=late?'#ff728c':'#9b8cff';X.font=`700 ${Math.max(10,fs-5)}px system-ui,sans-serif`;X.textAlign='center';X.direction=S.lang==='ar'?'rtl':'ltr';X.fillText(HORROR[S.lang].names[Math.max(0,Math.min(9,lvl-1))],W/2,y+16);
 X.fillStyle=late?'#ffe0e6':'#d7d3ff';X.font=`500 ${fs}px system-ui,sans-serif`;
 shownLines.forEach((ln,i)=>X.fillText(ln,W/2,y+29+lh*(i+.5)));
 if(Math.sin(tm*31+whisperIndex)>.985){X.globalAlpha=alpha*(.25+lvl*.035);X.fillStyle=late?'#ff315a':'#4ce4ff';shownLines.forEach((ln,i)=>X.fillText(ln,W/2+2,y+29+lh*(i+.5)))}
 X.restore();
}

  }

 if(!apparition&&levelPlayTime>=apparitionNext){
  if(apparitionCursor>=apparitionOrder.length)shuffleApparitionOrder();

}
