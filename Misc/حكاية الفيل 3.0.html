 else if(h.k=='chk')L.chk=Math.max(0,L.chk+dx);else if(h.k=='fx')L.fx=Math.max(0,Math.min(L.W-1,L.fx+dx/T))}
function lePDown(ev){const m=leCell(ev),t=LE.tool,L=LE.L;
 if(t=='draw'||t=='erase'){lePush();LE.drag={k:'paint',last:[m.tx,m.ty]};lePaint(m.tx,m.ty,m)}
 else if(t=='rect'){LE.drag={k:'rect',a:[m.tx,m.ty]};LE.rect=[m.tx,m.ty,m.tx,m.ty]}
 else if(t=='sel'){const h=leHit(m.wx,m.wy);if(h){LE.sel=h;LE.reg=null;lePush();LE.drag={k:'move',ox:m.wx,oy:m.wy,acc:[0,0]}}else{LE.sel=null;const R=LE.reg,inR=R&&m.tx>=R[0]&&m.tx<=R[2]&&m.ty>=R[1]&&m.ty<=R[3];if(inR)LE.drag={k:'regmove',a:[m.tx,m.ty],d:[0,0]};else if(!LE.grp&&leIn(m.tx,m.ty)&&L.g[m.ty][m.tx]!='.'){LE.reg=[m.tx,m.ty,m.tx,m.ty];LE.drag={k:'regmove',a:[m.tx,m.ty],d:[0,0]}}else{LE.drag={k:'marq',a:[m.tx,m.ty]};LE.reg=[m.tx,m.ty,m.tx,m.ty]}}lePanel()}
 else{lePush();lePlace(m)}}
function lePaint(tx,ty,m){const L=LE.L;if(!leIn(tx,ty))return;
 if(LE.tool=='erase'){const h=leHit(m.wx,m.wy);if(h&&h.k!='fx'){leDel(h);leMark();return}if(L.g[ty][tx]!='.')leSetTile(tx,ty,'.');leMark();return}
 leSetTile(tx,ty,LE.tile);leMark()}
function leRegMove(dx,dy,copy){const L=LE.L,R=LE.reg,x1=R[0],y1=R[1],x2=R[2],y2=R[3],buf=[],bxb={};
 for(let y=y1;y<=y2;y++)for(let x=x1;x<=x2;x++){if(!leIn(x,y))continue;buf.push([x,y,L.g[y][x]]);const k=x+','+y;if(L.bx[k]!==undefined)bxb[k]=L.bx[k]}
 const inR=(px,py)=>{const tx=Math.floor(px/T),ty=Math.floor(py/T);return tx>=x1&&tx<=x2&&ty>=y1&&ty<=y2};
 if(!copy)for(const [x,y] of buf){L.g[y][x]='.';delete L.bx[x+','+y]}
 for(const [x,y,ch] of buf){const nx=x+dx,ny=y+dy;if(!leIn(nx,ny))continue;L.g[ny][nx]=ch;const k=x+','+y;if(bxb[k]!==undefined)L.bx[nx+','+ny]=bxb[k];else delete L.bx[nx+','+ny]}
 const sx=dx*T,sy=dy*T,cl=o=>JSON.parse(JSON.stringify(o));
 const each=(arr,pos,shift)=>{const n=arr.length;for(let i=0;i<n;i++){const o=arr[i],p=pos(o);if(!inR(p[0],p[1]))continue;if(copy){const c=cl(o);shift(c);arr.push(c)}else shift(o)}};
 each(L.en,o=>[o.x+o.w/2,o.y+o.h/2],o=>{o.x+=sx;o.y+=sy;o.by=o.y});
 each(L.co,o=>[o[0]+10,o[1]+10],o=>{o[0]+=sx;o[1]+=sy});
 if(!copy)each(L.sc,o=>[o[0]+13,o[1]+13],o=>{o[0]+=sx;o[1]+=sy});
 each(L.fbs,o=>[o.cx,o.cy],o=>{o.cx+=sx;o.cy+=sy});
 each(L.PL.l,o=>[o.ox+o.w/2,o.oy],o=>{if(!o.circ){o.ox+=sx;o.oy+=sy}});
 for(const w of L.warps)if(w.x>=x1&&w.x+1<=x2&&w.ty>=y1&&w.ty<=y2){if(copy)L.warps.push({x:w.x+dx,ty:w.ty+dy});else{w.x+=dx;w.ty+=dy}}
 if(!copy)L.exits=L.exits.map(x=>x>=x1&&x+1<=x2?x+dx:x);
 LE.reg=[x1+dx,y1+dy,x2+dx,y2+dy];leMark()}
function leRegClear(){const L=LE.L,R=LE.reg,x1=R[0],y1=R[1],x2=R[2],y2=R[3];for(let y=y1;y<=y2;y++)for(let x=x1;x<=x2;x++)if(leIn(x,y)){L.g[y][x]='.';delete L.bx[x+','+y]}
 const inR=(px,py)=>{const tx=Math.floor(px/T),ty=Math.floor(py/T);return tx>=x1&&tx<=x2&&ty>=y1&&ty<=y2};
 L.en=L.en.filter(o=>!inR(o.x+o.w/2,o.y+o.h/2));L.co=L.co.filter(o=>!inR(o[0]+10,o[1]+10));L.fbs=L.fbs.filter(o=>!inR(o.cx,o.cy));L.PL.l=L.PL.l.filter(o=>o.circ||!inR(o.ox+o.w/2,o.oy));leMark()}
function lePlace(m){const L=LE.L,t=LE.tool,tx=m.tx,ty=m.ty;if(!leIn(tx,ty))return;
 if(t=='ent'){L.en.push(leMkEn(LE.ent,tx,ty))}
 else if(t=='coin'){const i=L.co.findIndex(q=>Math.floor((q[0]+10)/T)==tx&&Math.floor((q[1]+10)/T)==ty);if(i>=0)L.co.splice(i,1);else L.co.push([tx*T+6,ty*T+6])}
 else if(t=='star'){L.sc=L.sc.filter(q=>q[2]!=LE.starK);L.sc.push([tx*T+3,ty*T+2,LE.starK])}
 else if(t=='fb'){leSetTile(tx,ty,'U');L.fbs.push({cx:tx*T+16,cy:ty*T+16,n:LE.fbN,sp:.03,a0:0})}
 else if(t=='plat'){const r=LE.platR*T;L.PL.l.push(LE.platK=='h'?{x:0,y:0,w:96,h:12,ox:tx*T,oy:ty*T+6,ax:r,ay:0,sp:.022,ph:0}:{x:0,y:0,w:96,h:12,ox:tx*T,oy:ty*T+6,ax:0,ay:r,sp:.03,ph:0})}
 else if(t=='pipe')lePipe(tx,ty);
 else if(t=='chk'){L.chk=tx*T}else if(t=='flag'){L.fx=tx}
 leMark();lePanel()}
