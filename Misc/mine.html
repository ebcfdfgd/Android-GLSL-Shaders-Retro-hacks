<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">

<title>ألغام سودوكو</title>
<style>
:root{color-scheme:dark;--bg:#000;--sf:#101217;--sf2:#191e28;--pri:#19ffd8;--onpri:#001a15;--mine:#ff2e88;--tx:#e9fbff;--mu:#8c9cad;--line:#30394a;--y:#ffe600}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}html,body{height:100%;margin:0;background:#000;color:var(--tx);font-family:Roboto,"Noto Sans Arabic",system-ui,sans-serif}button,input,select{font:inherit}button{cursor:pointer}#app{max-width:460px;height:100dvh;min-height:100%;margin:auto;display:flex;flex-direction:column;overflow-y:auto;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);position:relative}#app>*{flex-shrink:0}.scr{display:none;flex-direction:column;min-height:100%}.scr.on{display:flex}.bar{display:flex;align-items:center;gap:8px;padding:12px 14px 6px;min-height:58px}.bar h1{flex:1;margin:0;font-size:21px;font-weight:600}.ic{width:42px;height:42px;border:1px solid #1d2a3a;border-radius:50%;background:var(--sf);color:var(--tx);font-size:20px}.hero{text-align:center;padding:9vh 24px 25px}.logo{font-size:58px;width:104px;height:104px;line-height:104px;margin:0 auto 14px;border-radius:32px;background:#0b0d12;box-shadow:0 0 22px rgba(25,255,216,.35),inset 0 0 14px rgba(25,255,216,.15)}.hero h1{margin:0;font-size:31px;font-weight:600;text-shadow:0 0 12px rgba(25,255,216,.45)}.hero p{color:var(--mu);margin:8px 0 0}.menu{padding:0 20px 24px;display:flex;flex-direction:column;gap:10px}.mb{border:1px solid #1d2a3a;border-radius:18px;background:var(--sf);color:var(--tx);padding:15px 17px;font-size:17px;font-family:inherit;text-align:center}.mb:active,.ic:active{background:var(--sf2)}.mb.p{background:var(--pri);color:var(--onpri);font-weight:700;border-color:var(--pri);box-shadow:0 0 13px rgba(25,255,216,.35)}.mb[hidden]{display:none!important}.sec{padding:12px 16px 5px;color:var(--mu);font-size:14px}.row{display:flex;align-items:center;gap:12px;margin:6px 14px;padding:13px 14px;background:var(--sf);border:1px solid #1d2a3a;border-radius:16px;font-size:15px}.row span:first-child{flex:1}.sw{width:50px;height:28px;border-radius:15px;background:var(--sf2);border:2px solid var(--line);position:relative}.sw::after{content:"";position:absolute;top:2px;inset-inline-start:2px;width:20px;height:20px;border-radius:50%;background:var(--mu);transition:.15s}.sw.on{background:var(--pri);border-color:var(--pri)}.sw.on::after{inset-inline-start:23px;background:var(--onpri)}.seg{display:flex;background:var(--sf2);border-radius:17px;padding:3px}.seg button{border:0;background:none;color:var(--mu);padding:8px 12px;border-radius:14px;font-size:14px}.seg button.on{background:var(--pri);color:var(--onpri);font-weight:700}.lvls{display:flex;flex-direction:column;gap:9px;padding:6px 14px 20px}.lvc{display:flex;align-items:center;gap:12px;border:1px solid #202a37;border-radius:17px;background:var(--sf);color:var(--tx);padding:12px 14px;font-size:16px;text-align:start}.lvc:active{background:var(--sf2)}.lvc b{width:42px;height:42px;line-height:42px;text-align:center;border-radius:13px;background:#071c1b;color:var(--pri);font-weight:700}.lvc span{flex:1}.lvc em{font-style:normal;color:var(--mu);font-size:12px}.chips{display:flex;gap:7px;padding:6px 12px}.chip{flex:1;background:var(--sf);border:1px solid #1d2a3a;border-radius:14px;padding:7px 6px;text-align:center}.chip b{display:block;font-size:19px;color:var(--y)}.chip span{font-size:11px;color:var(--mu)}#boardwrap{padding:8px 11px;flex:0 0 auto}#board{direction:ltr;display:grid;grid-template-columns:repeat(9,minmax(0,1fr));width:min(100%,calc(100dvh - 345px));min-width:min(100%,270px);margin:0 auto;background:#fff;gap:1px;border:3px solid #fff;border-radius:13px;overflow:hidden;position:relative;box-shadow:0 0 10px #fff,0 0 24px rgba(25,255,216,.28)}.c{aspect-ratio:1/1;min-width:0;min-height:0;overflow:hidden;border:0;border-radius:0;background:#05070b;color:var(--y);font-size:clamp(15px,5vw,22px);font-weight:700;padding:0;display:flex;align-items:center;justify-content:center}.c.clue{background:#0a0d14;color:var(--y);text-shadow:0 0 6px var(--y)}.c.m{background:#2a0618;color:var(--mine);text-shadow:0 0 8px var(--mine)}.c.s{background:#04201a;color:var(--pri);text-shadow:0 0 8px var(--pri)}.c.bad{animation:bad .35s}@keyframes bad{0%,60%{background:#6b0f2e}100%{}}.gl{position:absolute;background:#fff;pointer-events:none;z-index:2;box-shadow:0 0 6px #fff,0 0 12px rgba(25,255,216,.7)}.gl.v{top:0;bottom:0;width:3px;margin-left:-1.5px}.gl.h{left:0;right:0;height:3px;margin-top:-1.5px}#tools{display:flex;gap:6px;margin:6px 14px;padding:4px;background:var(--sf);border:1px solid #1d2a3a;border-radius:26px}.t{flex:1;border:0;border-radius:22px;background:none;color:var(--mu);padding:11px 3px;font-size:14px}.t.on{background:var(--pri);color:var(--onpri);font-weight:700}.pill{width:100px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 6px}.stc{margin:6px 14px;padding:14px;background:var(--sf);border:1px solid #1d2a3a;border-radius:17px}.stc h3{margin:0 0 9px;font-weight:600;font-size:16px}.stg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center}.stg b{display:block;font-size:20px;color:var(--y)}.stg span{font-size:11px;color:var(--mu)}#ov{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:30;padding:15px}#ov.on{display:flex}.dlg{background:var(--sf);border:1px solid var(--pri);box-shadow:0 0 22px rgba(25,255,216,.24);border-radius:24px;padding:23px;width:min(90vw,360px);text-align:center}.dlg h2{margin:0 0 8px;font-weight:600}.dlg p{color:var(--mu);margin:6px 0 18px;line-height:1.7}.dlg button{border:0;border-radius:18px;background:var(--pri);color:var(--onpri);padding:11px 20px;font-size:15px;font-weight:700;margin:3px}.spin{width:34px;height:34px;border:4px solid var(--sf2);border-top-color:var(--pri);border-radius:50%;margin:0 auto 14px;animation:r 1s linear infinite}@keyframes r{to{transform:rotate(360deg)}}#toast{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 14px);left:50%;transform:translateX(-50%);background:#151922;border:1px solid var(--pri);padding:10px 15px;border-radius:14px;font-size:13px;display:none;z-index:40;max-width:92vw;text-align:center}#toast.on{display:block}.genIntro{margin:8px 14px;padding:14px;border:1px solid #1d2a3a;background:var(--sf);border-radius:16px;color:var(--mu);font-size:13px;line-height:1.65}.genActions{display:flex;flex-wrap:wrap;gap:8px;margin:7px 14px}.genActions .mb{flex:1;min-width:125px;padding:12px 10px;font-size:14px}.genCount{margin:8px 14px;background:var(--sf);border:1px solid #1d2a3a;border-radius:18px;padding:14px}.genCount label{display:block;margin-bottom:8px;color:var(--mu);font-size:14px}.genCount input{width:100%;border:1px solid #344254;background:#05070b;color:var(--tx);border-radius:12px;padding:12px;font-size:19px;text-align:center}.meter{height:8px;border-radius:8px;background:#252b36;overflow:hidden;margin-top:10px}.meter i{display:block;height:100%;width:0;background:var(--pri);box-shadow:0 0 10px var(--pri);transition:width .2s}.mini{position:fixed;right:8px;bottom:calc(env(safe-area-inset-bottom) + 5px);max-width:min(86vw,350px);z-index:18;display:none;background:rgba(8,12,18,.96);border:1px solid var(--pri);color:var(--tx);border-radius:14px;padding:7px 10px;font-size:11px;box-shadow:0 0 12px rgba(25,255,216,.15);pointer-events:none}.mini.on{display:block}.mini b{color:var(--y)}.muted{color:var(--mu);font-size:12px;line-height:1.6}.twoBtns{display:flex;gap:8px;margin:8px 14px 22px}.twoBtns .mb{flex:1}.badge{display:inline-block;color:var(--pri);font-size:12px;border:1px solid #21403e;padding:3px 8px;border-radius:9px}
@media(max-height:650px){.hero{padding-top:4vh;padding-bottom:15px}.logo{width:75px;height:75px;line-height:75px;font-size:43px;border-radius:25px}.hero h1{font-size:27px}#board{width:min(100%,calc(100dvh - 310px))}.c{font-size:clamp(13px,4.5vw,20px)}.menu{gap:7px}.mb{padding:12px}}
@media(prefers-reduced-motion:reduce){.c.bad,.spin{animation:none}}

/* Theme selector and full visual palettes */
.theme-row{align-items:stretch;flex-direction:column;gap:8px}
.theme-row>span{flex:none!important;font-weight:700}
.theme-row .seg{width:100%;}
.theme-row .seg button{flex:1;padding:10px 7px;white-space:nowrap}
.theme-row .seg button.on{outline:2px solid var(--pri);outline-offset:1px}
html[data-theme="glow"]{color-scheme:dark;--bg:#000000;--sf:#101217;--sf2:#191e28;--pri:#19ffd8;--onpri:#001a15;--mine:#ff2e88;--tx:#e9fbff;--mu:#8c9cad;--line:#30394a;--y:#ffe600}
html[data-theme="classic"]{color-scheme:light;--bg:#eef3ed;--sf:#ffffff;--sf2:#e1eae0;--pri:#28764d;--onpri:#ffffff;--mine:#d64c2e;--tx:#1b2b20;--mu:#617568;--line:#8fa495;--y:#a96b08}
html[data-theme="classic"] body,html[data-theme="classic"] #app{background:var(--bg);color:var(--tx)}
html[data-theme="classic"] .logo{background:#dce9dd;box-shadow:0 5px 18px rgba(32,93,57,.16),inset 0 0 0 1px #c4d5c5}

html[data-theme="classic"] .lvc b{background:#dcebe0;color:#21683f}
html[data-theme="classic"] .chip b,html[data-theme="classic"] .stg b{color:#a96b08}
html[data-theme="classic"] #board{background:#8fa495;border:3px solid #8fa495;box-shadow:0 4px 14px rgba(24,61,37,.15)}
html[data-theme="classic"] .c{background:#fffefa;color:#27372c;box-shadow:none;font-weight:600}
html[data-theme="classic"] .c.clue{background:#dce9dd;color:#1d633b;text-shadow:none}
html[data-theme="classic"] .c.m{background:#fbe6dc;color:#b63820;text-shadow:none}
html[data-theme="classic"] .c.s{background:#e0f2e4;color:#216d42;text-shadow:none}
html[data-theme="classic"] .gl{background:#547461;box-shadow:none}
html[data-theme="classic"] .t.on,html[data-theme="classic"] .seg button.on{box-shadow:none}
html[data-theme="classic"] .dlg{border-color:#b6cbbb;box-shadow:0 8px 28px rgba(24,61,37,.18)}
html[data-theme="classic"] .genCount input{background:#fff;color:#1b2b20;border-color:#c8d4c9}
html[data-theme="classic"] .meter{background:#d4e0d5}
html[data-theme="classic"] .mini{background:rgba(255,255,255,.97);border-color:#c1d1c3;box-shadow:0 3px 12px rgba(24,61,37,.12)}
html[data-theme="classic"] #toast{background:#fff;border-color:#b6cbbb;color:#1b2b20;box-shadow:0 3px 12px rgba(24,61,37,.12)}
html[data-theme="classic"] .badge{border-color:#a9c6b0;color:#28764d}
html[data-theme="dark"]{color-scheme:dark;--bg:#000000;--sf:#000000;--sf2:#080808;--pri:#e6e6e6;--onpri:#000000;--mine:#c6a5ff;--tx:#ffffff;--mu:#bdbdbd;--line:rgb(230,230,230);--y:#ffe000}
html[data-theme="dark"] body,html[data-theme="dark"] #app{background:#000000;color:#ffffff}
html[data-theme="dark"] .logo{background:#000000;box-shadow:inset 0 0 0 1px #e6e6e6}
html[data-theme="dark"] .hero h1{text-shadow:none}
html[data-theme="dark"] .ic,html[data-theme="dark"] .mb,html[data-theme="dark"] .row,html[data-theme="dark"] .lvc,html[data-theme="dark"] .chip,html[data-theme="dark"] #tools,html[data-theme="dark"] .stc,html[data-theme="dark"] .genIntro,html[data-theme="dark"] .genCount{background:#000000;border-color:#3a3a3a;color:#fff}
html[data-theme="dark"] .mb.p,html[data-theme="dark"] .t.on,html[data-theme="dark"] .seg button.on{background:#e6e6e6;color:#000;box-shadow:none;border-color:#e6e6e6}
html[data-theme="dark"] .lvc b{background:#000;color:#e6e6e6;box-shadow:inset 0 0 0 1px #555}
html[data-theme="dark"] .chip b,html[data-theme="dark"] .stg b{color:#ffe000;text-shadow:none}
html[data-theme="dark"] #board{background:#000000;border:3px solid rgb(230,230,230);box-shadow:none;gap:1px}
html[data-theme="dark"] .c,html[data-theme="dark"] .c.r2,html[data-theme="dark"] .c.cl2{background:#000000;color:#ffffff;box-shadow:none;font-weight:600}
html[data-theme="dark"] .c.clue{background:#000000;color:#ffffff;text-shadow:none;box-shadow:none}
html[data-theme="dark"] .c.m{background:#000000;color:var(--mine);text-shadow:none;box-shadow:none}
html[data-theme="dark"] .c.s{background:#000000;color:#e6e6e6;text-shadow:none;box-shadow:none}
html[data-theme="dark"] .gl{background:rgb(230,230,230);box-shadow:none}
html[data-theme="dark"] .gl.v{width:3px;height:auto}
html[data-theme="dark"] .gl.h{left:0;right:0;width:auto;height:3px}
html[data-theme="dark"] .dlg{background:#000;border-color:#e6e6e6;box-shadow:none}
html[data-theme="dark"] .dlg button{background:#e6e6e6;color:#000}
html[data-theme="dark"] .genCount input{background:#000;color:#fff;border-color:#e6e6e6}
html[data-theme="dark"] .meter{background:#202020}
html[data-theme="dark"] .meter i{background:#e6e6e6;box-shadow:none}
html[data-theme="dark"] .mini{background:#000;border-color:#555;box-shadow:none}
html[data-theme="dark"] #toast{background:#000;border-color:#e6e6e6;color:#fff;box-shadow:none}
html[data-theme="dark"] .badge{border-color:#777;color:#e6e6e6}
.mineGlyph{display:block;width:72%;height:72%;margin:auto}


/* Dark theme: make every small Sudoku cell edge visible while keeping the 3x3 separators bright white-gray. */
html[data-theme="dark"] #board{gap:0;background:#000000;border:3px solid rgb(230,230,230)}
html[data-theme="dark"] #board .c,
html[data-theme="dark"] #board .c.r2,
html[data-theme="dark"] #board .c.cl2{
  border:1px solid #383838!important;
  outline:none;
}
html[data-theme="dark"] #board .gl{background:rgb(230,230,230);box-shadow:none}
html[data-theme="dark"] #board .gl.v{width:3px}
html[data-theme="dark"] #board .gl.h{height:3px}

</style>
</head>
<body>
<div id="app">
  <section class="scr on" id="home">
    <div class="hero"><div class="logo">💣</div><h1 data-i="title"></h1><p data-i="tag"></p></div>
    <div class="menu">
      <button class="mb p" id="mNew" data-i="new"></button>
      <button class="mb" id="mContinue" data-i="continue" hidden></button>
      <button class="mb" id="mSet" data-i="settings"></button>
      <button class="mb" id="mSta" data-i="stats"></button>
    </div>
  </section>
  <section class="scr" id="pick">
    <div class="bar"><button class="ic bk" data-to="home">↩</button><h1 data-i="new"></h1><button class="ic" id="help">؟</button></div>
    <div class="sec" data-i="level"></div><div class="lvls" id="lvls"></div>
  </section>
  <section class="scr" id="settings">
    <div class="bar"><button class="ic bk" data-to="home">↩</button><h1 data-i="settings"></h1></div>
    <div class="row theme-row"><span data-i="themeLabel">المظهر</span><div class="seg" id="segTheme"><button data-v="glow" data-i="themeGlow">جلو</button><button data-v="classic" data-i="themeClassic">كلاسيكي</button><button data-v="dark" data-i="themeDark">دارك</button></div></div>
    <div class="row" id="rSound"><span data-i="sound"></span><i class="sw" id="swSound"></i></div>
    <div class="row" id="rVib"><span data-i="vib"></span><i class="sw" id="swVib"></i></div>
    <div class="row"><span data-i="hearts"></span><div class="seg" id="segHearts"><button data-v="0" data-i="off"></button><button data-v="1">1</button><button data-v="2">2</button><button data-v="3">3</button></div></div>
    <div class="row" id="rFull"><span data-i="full"></span><i class="sw" id="swFull"></i></div>
    <div class="row" id="rAwake"><span data-i="awake"></span><i class="sw" id="swAwake"></i></div>
    <div class="row"><span data-i="lang"></span><div class="seg" id="segLang"><button data-v="ar">العربية</button><button data-v="en">English</button></div></div>
  </section>
  <section class="scr" id="stats">
    <div class="bar"><button class="ic bk" data-to="home">↩</button><h1 data-i="stats"></h1></div><div id="stl"></div>
    <div class="menu" style="padding-top:12px;padding-bottom:20px"><button class="mb" id="reset" data-i="reset"></button></div>
  </section>
  <section class="scr" id="game">
    <div class="bar"><button class="ic" id="gback"></button><h1 id="gt"></h1></div>
    <div class="chips"><div class="chip"><b id="tm">0:00</b><span data-i="time"></span></div><div class="chip"><b id="left">27</b><span data-i="mines"></span></div><div class="chip"><b id="hr"></b><span data-i="lives"></span></div></div>
    <div id="boardwrap"><div id="board"></div></div>
    <div id="tools"><button class="t on" data-t="1" id="t1"></button><button class="t" data-t="2" id="t2"></button><button class="t" data-t="0" id="t0" data-i="erase"></button></div>
  </section>
</div>
<div id="genMini" class="mini"></div><div id="ov"><div class="dlg" id="dlg"></div></div><div id="toast"></div>
<script type="text/plain" id="eng">
const CONTRA={},TIMEOUT={};let DL=Infinity;
const NB=[];for(let r=0;r<9;r++)for(let c=0;c<9;c++){const a=[];for(let dr=-1;dr<2;dr++)for(let dc=-1;dc<2;dc++){const y=r+dr,x=c+dc;if((dr||dc)&&y>=0&&y<9&&x>=0&&x<9)a.push(y*9+x)}NB.push(a)}
const BASE=[];for(let i=0;i<9;i++){BASE.push({c:[...Array(9)].map((_,k)=>i*9+k),n:3});BASE.push({c:[...Array(9)].map((_,k)=>k*9+i),n:3})}for(let b=0;b<9;b++){const a=[];for(let r=0;r<3;r++)for(let c=0;c<3;c++)a.push(((b/3|0)*3+r)*9+(b%3)*3+c);BASE.push({c:a,n:3})}
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
function makeLayout(){const combos=[];for(let a=0;a<9;a++)for(let b=a+1;b<9;b++)for(let c=b+1;c<9;c++)combos.push([a,b,c]);for(;;){let calls=0;const g=Array(81).fill(0),col=Array(9).fill(0),box=Array(9).fill(0);const row=r=>{if(++calls>3000)return false;if(r===9)return col.every(v=>v===3);for(const cb of shuffle(combos.slice())){if(cb.some(c=>col[c]>=3))continue;const bx=cb.map(c=>(r/3|0)*3+(c/3|0));cb.forEach((c,i)=>{col[c]++;box[bx[i]]++});if(box.every(v=>v<=3)){cb.forEach(c=>g[r*9+c]=1);if(row(r+1))return true;cb.forEach(c=>g[r*9+c]=0)}cb.forEach((c,i)=>{col[c]--;box[bx[i]]--})}return false};if(row(0))return g}}
function active(st,cons){const out=[];for(const q of cons){const U=[];let m=0;for(const x of q.c){const v=st[x];if(v<0)U.push(x);else m+=v}const k=q.n-m;if(k<0||k>U.length)throw CONTRA;if(U.length)out.push({U,k})}return out}

function start(level){dialog(`<div class="spin"></div><p style="margin:0 0 14px">${T('loading')}</p>`,[[T('cancel'),cancelGameGen]]);generateAsync(level,levelBudget(level),p=>{$('ov').classList.remove('on');const nums={};p.clues.forEach(c=>nums[c]=NB[c].reduce((sum,x)=>sum+p.layout[x],0));G={level,layout:p.layout,clues:new Set(p.clues),nums,marks:Array(81).fill(0),done:false};if(timer){clearInterval(timer);timer=null}hearts=S.hearts;errs=0;secs=0;$('tm').textContent='0:00';$('gt').textContent=T('lv')[level-1];render();show('game');SFX.start();saveProgress();runGameTimer()})}$('gback').onclick=()=>{SFX.clear();goBack('pick')};function finishIfWon(){if(!G||G.done)return;const allMinesMarked=G.layout.every((v,k)=>!v||G.marks[k]===1);const noFalseMineMarks=G.marks.every((m,k)=>m!==1||G.layout[k]===1);if(allMinesMarked&&noFalseMineMarks){G.done=true;if(timer){clearInterval(timer);timer=null}clearProgress();SFX.win();const lv=G.level,t=secs,e=errs;bump(lv,s=>{s.w++;if(s.b==null||t<s.b)s.b=t});setTimeout(()=>dialog(`<h2>${T('winT')}</h2><p>${T('winP')(fmt(t),e)}</p>`,[[T('again'),()=>start(lv)],[T('menu'),()=>goBack('pick')]]),450)}}
function tap(i){if(!G||G.done||G.clues.has(i))return;const el=cells[i],isMine=G.layout[i]===1;if(tool===0){if(G.marks[i]){G.marks[i]=0;SFX.clear();render();saveProgress()}return}
  // With hearts off, accept any mark without error sounds or warning animation.
  if(S.hearts===0){
    if(G.marks[i]===tool){G.marks[i]=0;SFX.clear();render();saveProgress();finishIfWon();return}
    const wrong=(tool===1)!==isMine;
    G.marks[i]=tool;
    if(wrong){errs++;bump(G.level,s=>s.e++)}
    tool===1?SFX.mine():SFX.safe();
    render();saveProgress();finishIfWon();return
  }
  if((tool===1)!==isMine){errs++;if(S.hearts)hearts--;bump(G.level,s=>s.e++);SFX.err();el.classList.remove('bad');void el.offsetWidth;el.classList.add('bad');stats();if(S.hearts&&hearts<=0){G.done=true;if(timer){clearInterval(timer);timer=null}clearProgress();const lv=G.level;setTimeout(()=>dialog(`<h2>${T('lostT')}</h2><p>${T('lostP')}</p>`,[[T('retry'),()=>start(lv)],[T('menu'),()=>goBack('pick')]]),400)}else saveProgress();return}
  if(G.marks[i]===tool){G.marks[i]=0;SFX.clear();render();saveProgress();return}G.marks[i]=tool;tool===1?SFX.mine():SFX.safe();render();saveProgress();finishIfWon()}
function levelBudget(level){return [8000,10000,14000,18000,24000][level-1]||8000}
/* initialize: normalize independent per-level numbering, restore file handle and resume unfinished targets */
applyTheme();applyLang();refreshContinueButton();
